name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q thecmanager supervisor

      - name: Import the app
        # Catches the failure that matters most: a server that cannot start.
        env:
          MANAGER_PROJECTS_DIRS: ${{ github.workspace }}
        run: python -c "from thecmanager import server; print('app imported:', server.app.title)"

      - name: Boot and probe
        env:
          MANAGER_PROJECTS_DIRS: ${{ github.workspace }}
          MANAGER_NO_BROWSER: "1"
          MANAGER_PORT: "8420"
        run: |
          python -m thecmanager &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8420/; then
              echo "dashboard answered"
              curl -sf http://127.0.0.1:8420/api/settings/roots
              exit 0
            fi
            sleep 1
          done
          echo "dashboard never answered" >&2
          exit 1

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the shell
        run: node --check desktop/main.js
      - name: Validate the builder config
        run: node -e "const p=require('./desktop/package.json'); if(!p.build?.appId) throw new Error('missing build.appId'); console.log('config ok:', p.build.productName)"

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed
        # Every credential this project can hold, not just the API-key shapes.
        # The Ops Room stores an OAuth token now, and a Telegram bot token and a
        # Tavily key were already possible; none of those matched the old
        # pattern, so the check would have passed while publishing one.
        run: |
          if git grep -InE '(sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|tvly-[A-Za-z0-9-]{20,}|[0-9]{8,}:AA[A-Za-z0-9_-]{30,}|"(access|refresh)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9_.-]{30,}")' -- . ':!.env.example' ; then
            echo "::error::possible secret committed"
            exit 1
          fi
          echo "clean"

      - name: Runtime state is never tracked
        # These files hold the OAuth token, the bot token and the phone token on
        # a real install. In a source checkout they sit inside the repo, one
        # `git add -f` away from being published with it.
        run: |
          bad=0
          for f in .env data/credentials.json data/settings.json data/registry.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked and must not be"
              bad=1
            fi
          done
          [ "$bad" = "0" ] || exit 1
          echo "clean"

      - name: No hardcoded home directories
        # These are what stopped GSO-1 running on anyone else's machine.
        run: |
          if git grep -InE '/(Users|home)/[a-z][a-z0-9_-]+' -- '*.py' '*.js' '*.ts' '*.html' ; then
            echo "::error::hardcoded home directory, derive it at runtime"
            exit 1
          fi
          echo "clean"

      - name: .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          echo "clean"

      # The website's release notes are generated from CHANGELOG.md. Checking
      # them here is what turns "remember to update the site" into something
      # that cannot be forgotten: change the changelog without rebuilding and
      # the build says so, on the pull request, before it ships.
      - name: Release notes page is up to date
        run: |
          python3 scripts/build_docs.py --check

      - name: Shipped version matches the changelog
        run: |
          PKG=$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")
          PY=$(python3 -c "import re;print(re.search(r'\"([^\"]+)\"',open('thecmanager/__init__.py').read().split('__version__ =')[1]).group(1))")
          LOG=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "package.json=$PKG  __init__=$PY  CHANGELOG=$LOG"
          if [ "$PKG" != "$PY" ] || [ "$PKG" != "$LOG" ]; then
            echo "::error::version mismatch; these three must agree"
            exit 1
          fi
          echo "clean"
