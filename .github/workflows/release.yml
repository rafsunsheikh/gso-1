name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Apple Silicon runner cross-builds both architectures. The
          # Intel (macos-13) runners are retired, so a job pinned to them
          # simply queues forever instead of failing.
          - os: macos-14
            name: macOS (Intel + Apple Silicon)
            builder: --mac --arm64 --x64
            artifacts: "*.dmg"
          - os: windows-latest
            name: Windows
            builder: --win --x64
            artifacts: "*.exe"
          - os: ubuntu-latest
            name: Linux
            builder: --linux --x64
            artifacts: "*.AppImage,*.deb"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Freeze the backend
        run: pyinstaller build/gso1-server.spec --noconfirm --distpath build/dist --workpath build/work

      - name: Smoke-test the frozen backend (unix)
        if: runner.os != 'Windows'
        env:
          MANAGER_PORT: "8420"
          MANAGER_PROJECTS_DIRS: ${{ github.workspace }}
        run: |
          ./build/dist/gso1-server/gso1-server &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8420/; then echo "frozen server OK"; exit 0; fi
            sleep 1
          done
          echo "frozen server never answered" >&2; exit 1

      - name: Smoke-test the frozen backend (windows)
        if: runner.os == 'Windows'
        env:
          MANAGER_PORT: "8420"
          MANAGER_PROJECTS_DIRS: ${{ github.workspace }}
        shell: pwsh
        run: |
          Start-Process -FilePath "build\dist\gso1-server\gso1-server.exe"
          for ($i = 0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -Uri http://127.0.0.1:8420/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              Write-Host "frozen server OK"; exit 0
            } catch { Start-Sleep -Seconds 1 }
          }
          Write-Error "frozen server never answered"; exit 1

      - name: Install shell dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Build the installer
        working-directory: desktop
        env:
          # Deliberately no GH_TOKEN. Its presence makes electron-builder infer
          # a GitHub publish provider and build auto-update metadata, which then
          # dies on `--publish never` with "Cannot read properties of null
          # (reading 'channel')". The release is assembled from uploaded
          # artifacts in the publish job instead.
          #
          # Unsigned builds still install; users get an OS warning. Set the
          # signing secrets in the repo to produce trusted builds.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find build/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: gso1-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GSO-1 ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: true
          files: dist/*
          body: |
            ## Install

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `GSO-1-*-arm64.dmg` |
            | macOS (Intel) | `GSO-1-*.dmg` |
            | Windows | `GSO-1-Setup-*.exe` |
            | Linux | `GSO-1-*.AppImage` / `*.deb` |

            On first run GSO-1 asks which folder holds your projects. Nothing
            leaves your machine.

            > These builds are **unsigned**. macOS will ask you to allow the app
            > in System Settings → Privacy & Security; Windows SmartScreen needs
            > "More info" → "Run anyway".

            Verify a download against `SHA256SUMS.txt`.
