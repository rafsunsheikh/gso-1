name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "desktop/package.json"
      - "scripts/build_docs.py"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The old step read `git tag | head -1` on a checkout that does not fetch
      # tags, so it always hit its v0.1.0 fallback and the site advertised a
      # version four releases old. The version now comes from a file that is
      # committed and is the same one the installers are built from.
      - name: Build the site
        run: |
          python3 scripts/build_docs.py --out _site
          grep -o 'Download GSO-1 v[0-9.]*' _site/index.html | head -1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
