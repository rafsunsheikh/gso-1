<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="GSO-1">
  <!-- The handoff's identity mark: 270 repos, one live.
       96x96 rounded square (r23) in #14121f with a 3px inner stroke, four
       20x20 r5 cells at 24/52 — brand purple, two at 50%, one teal. -->
  <rect width="96" height="96" rx="23" fill="#14121f"/>
  <rect x="1.5" y="1.5" width="93" height="93" rx="21.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <rect x="24" y="24" width="20" height="20" rx="5" fill="#502ce7"/>
  <rect x="52" y="24" width="20" height="20" rx="5" fill="#502ce7" fill-opacity="0.5"/>
  <rect x="24" y="52" width="20" height="20" rx="5" fill="#502ce7" fill-opacity="0.5"/>
  <rect x="52" y="52" width="20" height="20" rx="5" fill="#00e0b7"/>
</svg>
