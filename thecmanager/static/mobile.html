<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>GSO-1</title>
  <!-- viewport-fit=cover so the tab bar can pad past the home indicator -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GSO-1" />
  <meta name="theme-color" content="#09080f" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/static/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- The token table is shared with the desktop app; only the layout differs. -->
  <link rel="stylesheet" href="/static/tokens.css" />
  <script>
    // Apply the stored theme before first paint.
    (function () {
      try {
        var t = localStorage.getItem("gsoTheme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
    /* ============================================================
       Phone companion. Check and unblock, not manage: no 270-row
       table, browsing is search-first, every target is 44pt+.
       ============================================================ */
    /* tokens.css carries no reset; without border-box every padded input is
       wider than its column and the whole page scrolls sideways. */
    *, *::before, *::after { box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      overflow-x: hidden;
      font-family: "Readex Pro", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .app { display: flex; flex-direction: column; height: 100dvh; }
    .scroll {
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 16px 22px;
    }

    /* ---- header ---- */
    .hd {
      flex: none; display: flex; align-items: center; gap: 11px;
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      background: var(--bg);
    }
    .hd-logo { width: 30px; height: 30px; border-radius: 9px; flex: none; }
    .hd-live {
      width: 9px; height: 9px; border-radius: 999px; flex: none; margin: 0 5px 0 3px;
      background: var(--live); animation: mPulse 2s ease-in-out infinite;
    }
    @keyframes mPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .hd-live { animation: none; } }
    .hd-txt { flex: 1; min-width: 0; }
    .hd-t {
      font: 700 19px/1.15 "Readex Pro", system-ui, sans-serif; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hd-s {
      margin-top: 2px; font-size: 11.5px; color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hd-btn {
      width: 38px; height: 38px; flex: none; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
    }
    .hd-btn:active { background: var(--hover); }
    .hd-back {
      width: 34px; height: 38px; flex: none; border: 0; background: none;
      color: var(--text-2); font-size: 24px; line-height: 1; padding: 0; text-align: left;
    }

    /* ---- section rule ---- */
    .rule {
      display: flex; align-items: center; gap: 8px; margin: 18px 0 9px;
      font: 600 10.5px ui-monospace, Menlo, monospace;
      letter-spacing: 0.11em; text-transform: uppercase; color: var(--label);
    }
    .rule .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--idle); flex: none; }
    .rule .n { margin-left: auto; font-size: 11px; color: var(--text-3); letter-spacing: 0; }

    /* ---- live cards ---- */
    .live {
      display: flex; align-items: center; gap: 11px; margin-bottom: 9px;
      padding: 13px 14px; border-radius: 15px;
      background: var(--live-soft); border: 1px solid var(--live-line);
    }
    .live-b { flex: 1; min-width: 0; }
    .live-n {
      font: 600 14px "Readex Pro", system-ui, sans-serif; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .live-m {
      margin-top: 3px; font: 400 11.5px ui-monospace, Menlo, monospace; color: var(--text-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-stop {
      flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
      background: transparent; border: 1px solid var(--err-line); color: var(--err-text);
      font: 500 13px "Readex Pro", system-ui, sans-serif;
    }
    .btn-stop:active { background: var(--err-soft); }

    /* ---- needs-you rows ---- */
    .need {
      display: flex; align-items: center; gap: 11px; margin-bottom: 9px;
      padding: 12px 14px; border-radius: 15px;
      background: var(--card); border: 1px solid var(--line);
    }
    .need[data-tone="err"] { background: var(--err-soft); border-color: var(--err-line); }
    .need-b { flex: 1; min-width: 0; }
    .need-n {
      font: 600 13.5px "Readex Pro", system-ui, sans-serif; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .need-m { margin-top: 3px; font: 400 11.5px ui-monospace, Menlo, monospace; color: var(--warn-text); }
    .need[data-tone="err"] .need-m { color: var(--err-text); }
    .btn {
      flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
      font: 500 13px "Readex Pro", system-ui, sans-serif;
      background: var(--primary); border: 1px solid var(--primary); color: var(--on-primary);
    }
    .btn:disabled { opacity: 0.45; }
    .btn[data-tone="outline"] { background: transparent; border-color: var(--line); color: var(--text-2); }
    .btn[data-tone="teal"] { background: transparent; border-color: var(--live-line); color: var(--live-text); }
    .btn[data-tone="solid-teal"] { background: var(--live); border-color: var(--live); color: var(--on-live); }

    /* ---- meter card ---- */
    .meter {
      padding: 12px 14px; border-radius: 15px;
      background: var(--card); border: 1px solid var(--line);
    }
    .meter-row { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; color: var(--text-2); }
    .meter-row b { margin-left: auto; font: 600 11.5px ui-monospace, Menlo, monospace; color: var(--text); }
    .meter-row b[data-tone="warn"] { color: var(--warn-text); }
    .meter-row b[data-tone="err"] { color: var(--err-text); }
    .track {
      height: 6px; border-radius: 999px; background: var(--hover);
      margin: 7px 0 4px; display: flex; overflow: hidden;
    }
    .track > i { display: block; height: 100%; }

    /* ---- search + repo list ---- */
    .search {
      width: 100%; height: 44px; padding: 0 14px; margin: 4px 0 12px;
      border-radius: 14px; background: var(--card); border: 1px solid var(--line);
      color: var(--text); font-size: 15px;   /* 15px+ stops iOS zooming on focus */
    }
    .search:focus { outline: none; border-color: var(--primary); }
    .repo {
      display: flex; align-items: center; gap: 11px; width: 100%;
      padding: 13px 14px; margin-bottom: 8px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--line);
      text-align: left; color: inherit;
    }
    .repo:active { border-color: var(--primary-line); }
    .repo-b { flex: 1; min-width: 0; display: block; }
    .repo-n {
      display: block;
      font: 600 13.5px "Readex Pro", system-ui, sans-serif; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .repo-m {
      display: block;
      margin-top: 3px; font: 400 11px ui-monospace, Menlo, monospace; color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .repo-m b { color: var(--warn-text); font-weight: 600; }
    .chev { flex: none; color: var(--text-3); font-size: 19px; }

    /* ---- repo sheet ---- */
    .sheet-actions { display: flex; gap: 9px; margin: 4px 0 14px; }
    .sheet-actions .btn { flex: 1; height: 48px; border-radius: 14px; font-size: 15px; }
    .sq {
      width: 48px; height: 48px; flex: none; border-radius: 14px;
      background: var(--card); border: 1px solid var(--line); color: var(--text-2);
      font-size: 17px;
    }
    .card {
      padding: 13px 14px; margin-bottom: 12px; border-radius: 15px;
      background: var(--card); border: 1px solid var(--line);
    }
    .card[data-tone="err"] { background: var(--err-soft); border-color: var(--err-line); }
    .card-l {
      font: 600 10.5px ui-monospace, Menlo, monospace;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--label); margin-bottom: 9px;
    }
    .kv { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; font-size: 13px; color: var(--text-3); }
    .kv b {
      margin-left: auto; min-width: 0; text-align: right;
      font: 500 13px ui-monospace, Menlo, monospace; color: var(--text-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .kv b[data-tone="warn"] { color: var(--warn-text); font-weight: 600; }
    .kv b[data-tone="live"] { color: var(--live-text); font-weight: 600; }
    .divide { height: 1px; background: var(--line-2); margin: 9px 0; }
    .commit { font: 400 11.5px/1.5 ui-monospace, Menlo, monospace; color: var(--text-3); overflow-wrap: anywhere; }
    .pair { display: flex; gap: 9px; margin-top: 10px; }
    .pair .btn { flex: 1; height: 40px; }
    .switch {
      margin-left: auto; width: 42px; height: 25px; flex: none; padding: 0;
      border-radius: 999px; border: 0; background: var(--hover); position: relative;
    }
    .switch[aria-checked="true"] { background: var(--primary); }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 19px; height: 19px; border-radius: 999px; background: #fff;
      transition: transform 0.15s ease;
    }
    .switch[aria-checked="true"]::after { transform: translateX(17px); }
    .fail-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .fail-b {
      width: 17px; height: 17px; border-radius: 999px; flex: none; background: var(--err-text);
      color: #fff; font: 700 11px/17px "Readex Pro", sans-serif; text-align: center;
    }
    .fail-t { font: 600 13px "Readex Pro", system-ui, sans-serif; color: var(--err-text); }
    .fail-w { margin-left: auto; font: 400 11px ui-monospace, Menlo, monospace; color: var(--text-3); }
    .log {
      padding: 9px 10px; border-radius: 10px; background: var(--card-2);
      font: 400 11.5px/1.55 ui-monospace, Menlo, monospace; color: var(--text-2);
      white-space: pre-wrap; max-height: 150px; overflow: auto; margin-bottom: 10px;
    }

    /* ---- bottom sheets: a phone keyboard covers a centred dialog ---- */
    .sheet-host { position: fixed; inset: 0; z-index: 90; }
    .sheet-bg {
      position: absolute; inset: 0; background: rgba(0,0,0,.55);
      opacity: 0; transition: opacity .18s ease;
    }
    .sheet-host[data-on="1"] .sheet-bg { opacity: 1; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--line);
      border-radius: 18px 18px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.45);
      transform: translateY(100%); transition: transform .2s cubic-bezier(.2,.8,.2,1);
      max-height: 80vh; overflow: auto;
    }
    .sheet-host[data-on="1"] .sheet { transform: translateY(0); }
    .sheet-t { font: 650 15px "Readex Pro", system-ui, sans-serif; color: var(--text); }
    .sheet-n { margin-top: 5px; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); }
    .sheet-in {
      width: 100%; margin-top: 13px; padding: 12px 13px; border-radius: 11px;
      background: var(--bg); border: 1px solid var(--line); color: var(--text);
      font-size: 16px;   /* 16px or iOS zooms the page when it takes focus */
    }
    .sheet-in:focus { outline: none; border-color: var(--primary); }
    .picks { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pick {
      all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 9px;
      width: 100%; padding: 13px 13px; border-bottom: 1px solid var(--line-2);
      font: 400 13.5px ui-monospace, Menlo, monospace; color: var(--text-2);
    }
    .pick:last-child { border-bottom: 0; }
    .pick[aria-current="true"] { color: var(--text); font-weight: 600; }
    .pick-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick .tag { margin-left: auto; }
    .linkb {
      all: unset; cursor: pointer; color: var(--primary-text);
      font-size: 12.5px; font-weight: 600;
    }

    /* ---- changed files, and the repo summary ---- */
    .files {
      margin: 9px 0; border: 1px solid var(--line); border-radius: 10px;
      background: var(--card-2); max-height: 190px; overflow: auto;
    }
    .file {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px;
      font: 400 11.5px ui-monospace, Menlo, monospace; color: var(--text-2);
      overflow-wrap: anywhere;
    }
    .file-x {
      flex: none; width: 22px; text-align: center; border-radius: 5px;
      font-weight: 700; font-size: 10px; padding: 2px 0;
      background: var(--chip); color: var(--text-3);
    }
    .file-x[data-x="??"] { background: var(--warn-soft); color: var(--warn-text); }
    .file-x[data-x="M"] { background: var(--primary-soft); color: var(--primary-text); }
    .file-x[data-x="D"] { background: var(--err-soft); color: var(--err-text); }

    .sum-h { font: 600 14px "Readex Pro", system-ui, sans-serif; color: var(--text); line-height: 1.4; }
    .sum-p { margin: 6px 0 0; font-size: 13px; line-height: 1.55; color: var(--text-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .chip {
      padding: 3px 9px; border-radius: 999px; background: var(--chip);
      border: 1px solid var(--line); color: var(--text-2);
      font: 500 11px ui-monospace, Menlo, monospace;
    }
    .sum-s {
      margin: 12px 0 5px; font: 600 10px ui-monospace, Menlo, monospace;
      letter-spacing: .12em; text-transform: uppercase; color: var(--text-3);
    }
    .caveats { margin: 0; padding-left: 17px; }
    .caveats li { font-size: 12.5px; line-height: 1.5; color: var(--text-2); margin-bottom: 4px; }
    .sigs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 11px; }
    .sig {
      padding: 3px 8px; border-radius: 7px; background: var(--chip); color: var(--text-3);
      font: 500 11px ui-monospace, Menlo, monospace; white-space: nowrap;
    }
    .sig[data-on="1"] { background: var(--live-soft); color: var(--live-text); }
    .sum-f { margin-top: 7px; font: 400 11px ui-monospace, Menlo, monospace; color: var(--text-3); }
    .sum-f[data-tone="warn"] { color: var(--warn-text); }

    /* ---- planner ---- */
    .colbar { display: flex; gap: 7px; overflow-x: auto; padding: 4px 0 12px; }
    .colbtn {
      flex: none; height: 34px; padding: 0 13px; border-radius: 999px;
      background: var(--chip); border: 1px solid var(--line); color: var(--text-2);
      font-size: 12.5px; white-space: nowrap;
    }
    .colbtn[aria-pressed="true"] {
      background: var(--primary-soft); border-color: var(--primary-line);
      color: var(--primary-text); font-weight: 600;
    }
    .task {
      padding: 13px 14px; margin-bottom: 9px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--line);
      width: 100%; text-align: left; color: inherit;
    }
    .task-t { font: 500 13.5px/1.45 "Readex Pro", system-ui, sans-serif; color: var(--text); }
    .task[data-done="1"] .task-t { color: var(--text-3); text-decoration: line-through; }
    .task-m { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .task-r {
      flex: 1; min-width: 0; font: 400 11px ui-monospace, Menlo, monospace; color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tag {
      flex: none; padding: 2px 8px; border-radius: 999px; background: var(--chip);
      font: 600 10px ui-monospace, Menlo, monospace; color: var(--text-2);
    }

    /* ---- chat ---- */
    .chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
    .bub { padding: 11px 14px; font: 400 14px/1.5 "Readex Pro", system-ui, sans-serif; overflow-wrap: anywhere; }
    .bub[data-who="user"] {
      align-self: flex-end; max-width: 86%; border-radius: 16px 16px 5px 16px;
      background: var(--primary); color: #fff;
    }
    .bub[data-who="agent"] {
      align-self: flex-start; max-width: 92%; border-radius: 16px 16px 16px 5px;
      background: var(--card); border: 1px solid var(--line); color: var(--text-2);
      white-space: pre-wrap;
    }
    .bub-err { font-size: 12.5px; color: var(--err-text); }
    .replies { display: flex; gap: 8px; flex-wrap: wrap; }
    .reply {
      height: 34px; padding: 0 13px; border-radius: 999px; font-size: 12.5px;
      background: transparent; border: 1px solid var(--line); color: var(--text-2);
    }
    .reply[data-tone="yes"] { border-color: var(--live-line); color: var(--live-text); }
    .typing { display: flex; gap: 5px; padding: 12px 14px; width: 56px;
      border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
    .typing i { width: 6px; height: 6px; border-radius: 999px; background: var(--text-3);
      animation: mDots 1.1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes mDots { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }

    .composer {
      flex: none; display: flex; align-items: flex-end; gap: 9px;
      padding: 9px 16px; border-top: 1px solid var(--line-2); background: var(--surface);
    }
    .composer textarea {
      flex: 1; min-height: 46px; max-height: 130px; padding: 13px 16px;
      border-radius: 23px; background: var(--card); border: 1px solid var(--line);
      color: var(--text); font-size: 15px; resize: none; font-family: inherit;
    }
    .composer textarea:focus { outline: none; border-color: var(--primary); }
    .send {
      width: 34px; height: 34px; margin-bottom: 6px; flex: none; border: 0;
      border-radius: 999px; background: var(--live); color: var(--on-live); font-size: 16px;
    }
    .send:disabled { opacity: 0.45; }

    /* ---- tab bar ---- */
    .tabs {
      flex: none; display: flex; justify-content: space-around;
      padding: 7px 12px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line-2); background: var(--surface);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-width: 56px; padding: 6px 12px; border-radius: 12px;
      border: 0; background: none; color: var(--text-3);
      font: 600 9.5px "Readex Pro", system-ui, sans-serif;
    }
    .tab svg { display: block; }
    .tab[aria-current="page"] { background: var(--primary-soft); color: var(--primary-text); }

    /* ---- misc ---- */
    .empty { text-align: center; padding: 34px 16px; }
    .empty-t { font: 600 14px "Readex Pro", system-ui, sans-serif; color: var(--text); }
    .empty-s { font-size: 12.5px; color: var(--text-3); margin-top: 6px; }
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 60;
      display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 32px);
      padding: 11px 16px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      font: 500 13px "Readex Pro", system-ui, sans-serif; box-shadow: var(--shadow);
      animation: mToast 0.18s ease-out;
    }
    .toast .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--live); flex: none; }
    .toast[data-kind="error"] .dot { background: var(--err); }
    @keyframes mToast { from { opacity: 0; transform: translate(-50%, 8px); } }
    .skel { height: 13px; border-radius: 6px; background: var(--skeleton); margin: 7px 0; }

    /* ---- login gate ---- */
    .gate { display: flex; flex-direction: column; justify-content: center; height: 100dvh; padding: 0 26px; gap: 14px; }
    .gate img { width: 54px; height: 54px; border-radius: 16px; }
    .gate h1 { font: 700 21px "Readex Pro", system-ui, sans-serif; margin: 0; color: var(--text); }
    .gate p { font-size: 13px; line-height: 1.55; color: var(--text-3); margin: 0; }
    .gate input {
      height: 50px; padding: 0 16px; border-radius: 14px; font-size: 16px;
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      font-family: ui-monospace, Menlo, monospace;
    }
    .gate input:focus { outline: none; border-color: var(--primary); }
    .gate .btn { height: 50px; border-radius: 14px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="root" class="app"></div>
  <div id="toasts" aria-live="polite"></div>

  <script>
  "use strict";

  // ---------------------------------------------------------------- utils
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      credentials: "same-origin",
      headers: opts.body ? { "Content-Type": "application/json" } : undefined,
      ...opts,
    });
    if (res.status === 401) { STATE.locked = true; render(); throw new Error("locked"); }
    if (!res.ok) {
      // Git refusals carry their reason in the body. Throwing the status alone
      // turns "your local changes would be overwritten" into "400 Bad Request".
      let detail = `${res.status} ${res.statusText}`;
      try {
        const body = await res.text();
        const data = body && body.trim().startsWith("{") ? JSON.parse(body) : null;
        detail = (data && (data.detail || data.message || data.output)) || body.slice(0, 200) || detail;
      } catch (e) { /* keep the status */ }
      throw new Error(String(detail));
    }
    const type = res.headers.get("content-type") || "";
    return type.includes("json") ? res.json() : res.text();
  }

  /* Asking for a line of text, or for a choice from a list. A phone keyboard
     covers the bottom half of the screen, so both are bottom sheets that sit
     above it rather than centred dialogs the keyboard would hide. */
  function sheet(html) {
    return new Promise(resolve => {
      const host = document.createElement("div");
      host.className = "sheet-host";
      host.innerHTML = `<div class="sheet-bg"></div><div class="sheet">${html}</div>`;
      document.body.appendChild(host);
      requestAnimationFrame(() => host.dataset.on = "1");
      const close = (v) => {
        host.dataset.on = "";
        setTimeout(() => host.remove(), 180);
        resolve(v);
      };
      host.querySelector(".sheet-bg").onclick = () => close(null);
      host.addEventListener("click", e => {
        const b = e.target.closest("[data-sheet]");
        if (b) close(b.dataset.sheet === "__cancel__" ? null : b.dataset.sheet);
      });
      host._close = close;
      host._el = host;
    });
  }

  function askText(title, { note = "", value = "", ok = "OK", placeholder = "" } = {}) {
    return new Promise(resolve => {
      const host = document.createElement("div");
      host.className = "sheet-host";
      host.innerHTML = `<div class="sheet-bg"></div>
        <div class="sheet">
          <div class="sheet-t">${esc(title)}</div>
          ${note ? `<div class="sheet-n">${esc(note)}</div>` : ""}
          <input class="sheet-in" type="text" autocomplete="off" autocapitalize="off"
                 spellcheck="false" value="${esc(value)}" placeholder="${esc(placeholder)}"/>
          <div class="pair" style="margin-top:14px">
            <button class="btn" data-tone="outline" data-x="cancel">Cancel</button>
            <button class="btn" data-x="ok">${esc(ok)}</button>
          </div>
        </div>`;
      document.body.appendChild(host);
      requestAnimationFrame(() => host.dataset.on = "1");
      const input = host.querySelector(".sheet-in");
      setTimeout(() => input.focus(), 60);
      const close = (v) => { host.dataset.on = ""; setTimeout(() => host.remove(), 180); resolve(v); };
      host.querySelector(".sheet-bg").onclick = () => close(null);
      host.querySelector('[data-x="cancel"]').onclick = () => close(null);
      host.querySelector('[data-x="ok"]').onclick = () => close(input.value);
      input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); close(input.value); } };
    });
  }

  /** Pick one of a list. Returns the chosen value, or null. */
  function choose(title, items, { note = "" } = {}) {
    const rows = items.map(it => `
      <button class="pick" data-sheet="${esc(it.value)}" ${it.current ? 'aria-current="true"' : ""}>
        <span class="pick-n">${esc(it.label)}</span>
        ${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}
      </button>`).join("");
    return sheet(`<div class="sheet-t">${esc(title)}</div>
      ${note ? `<div class="sheet-n">${esc(note)}</div>` : ""}
      <div class="picks">${rows || '<div class="sheet-n">Nothing to choose.</div>'}</div>
      <button class="btn" data-tone="outline" data-sheet="__cancel__" style="width:100%;margin-top:12px">Cancel</button>`);
  }

  let _toastTimer = null;
  function toast(msg, kind) {
    const host = $("#toasts");
    clearTimeout(_toastTimer);
    host.innerHTML = "";
    const el = document.createElement("div");
    el.className = "toast";
    el.dataset.kind = kind || "info";
    el.innerHTML = `<span class="dot"></span><span></span>`;
    el.lastElementChild.textContent = msg;
    host.appendChild(el);
    _toastTimer = setTimeout(() => el.remove(), kind === "error" ? 6000 : 3200);
  }

  function fmtUptime(s) {
    s = Math.max(0, Math.round(s || 0));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.round(s / 60)}m`;
    const h = Math.floor(s / 3600);
    return `${h}h ${Math.round((s % 3600) / 60)}m`;
  }
  function ago(ts) {
    const m = Math.max(0, Math.round(Date.now() / 1000 - ts) / 60);
    if (m < 1) return "just now";
    if (m < 60) return `${Math.round(m)}m ago`;
    const h = m / 60;
    if (h < 24) return `${Math.round(h)}h ago`;
    const d = Math.round(h / 24);
    return d === 1 ? "yesterday" : `${d} days ago`;
  }
  const gb = (b) => (b / 1e9).toFixed(1);

  // ---------------------------------------------------------------- state
  const STATE = {
    tab: "ops",
    locked: false,
    overview: null,
    apps: null,
    planner: null,
    query: "",
    repo: null,          // open repo sheet (detail payload)
    repoName: null,
    plannerBoard: null,
    plannerCol: "todo",
    chat: [],            // {who, text}
    chatBusy: false,
    replies: [],
  };

  const COLS = [
    { id: "backlog", label: "Backlog" }, { id: "todo", label: "Today" },
    { id: "doing", label: "In progress" }, { id: "done", label: "Done" },
  ];

  const ICONS = {
    ops: '<svg viewBox="0 0 22 22" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7.2"/><circle cx="11" cy="11" r="2.4" fill="currentColor" stroke="none"/></svg>',
    repos: '<svg viewBox="0 0 22 22" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.2" y="3.2" width="6.4" height="6.4" rx="1.8"/><rect x="12.4" y="3.2" width="6.4" height="6.4" rx="1.8"/><rect x="3.2" y="12.4" width="6.4" height="6.4" rx="1.8"/><rect x="12.4" y="12.4" width="6.4" height="6.4" rx="1.8"/></svg>',
    planner: '<svg viewBox="0 0 22 22" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7.6"/><path d="M11 6.4V11l3 1.8"/></svg>',
    room: '<svg viewBox="0 0 22 22" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 3.4v15.2M3.4 11h15.2M5.6 5.6l10.8 10.8M16.4 5.6 5.6 16.4"/></svg>',
    more: '<svg viewBox="0 0 22 22" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="11" r="1.4"/><circle cx="11" cy="11" r="1.4"/><circle cx="17" cy="11" r="1.4"/></svg>',
    search: '<svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="5"/><path d="M11.8 11.8 15.5 15.5"/></svg>',
  };

  // ---------------------------------------------------------------- loads
  async function loadOverview(force) {
    STATE.overview = await api("/api/overview" + (force ? "?force=true" : ""));
  }
  async function loadApps() {
    const d = await api("/api/apps");
    STATE.apps = d.apps || [];
  }
  async function loadPlanner() {
    const d = await api("/api/planner");
    STATE.planner = d.boards || [];
    if (!STATE.plannerBoard && STATE.planner.length) STATE.plannerBoard = STATE.planner[0].id;
  }

  // ---------------------------------------------------------------- views
  function header(title, sub, right, back, lead) {
    return `<div class="hd">
      ${back ? `<button class="hd-back" data-act="back" aria-label="Back">&lsaquo;</button>`
        : lead === "live" ? `<span class="hd-live" aria-hidden="true"></span>`
        : `<img class="hd-logo" src="/static/favicon.svg" alt="" />`}
      <div class="hd-txt">
        <div class="hd-t">${esc(title)}</div>
        <div class="hd-s">${sub || ""}</div>
      </div>
      ${right || ""}
    </div>`;
  }

  function tabbar() {
    const tabs = [["ops", "Ops"], ["repos", "Repos"], ["planner", "Planner"],
                  ["room", "Room"], ["more", "More"]];
    return `<nav class="tabs">${tabs.map(([id, label]) =>
      `<button class="tab" data-tab="${id}" ${STATE.tab === id ? 'aria-current="page"' : ""}>
        ${ICONS[id]}<span>${label}</span></button>`).join("")}</nav>`;
  }

  // ---- 1. Ops feed
  function viewOps() {
    const ov = STATE.overview;
    if (!ov) {
      return header("Ops", "reading your machine…") +
        `<div class="scroll">${'<div class="skel" style="width:70%"></div><div class="skel"></div><div class="skel" style="width:85%"></div>'}</div>` +
        tabbar();
    }
    const c = ov.counts || {};
    const live = ov.live || [];

    const liveCards = live.length ? live.map(a => `
      <div class="live">
        <div class="live-b">
          <div class="live-n">${esc(a.name)}</div>
          <div class="live-m">${a.port ? `:${a.port} · ` : ""}${esc(
            (a.detail || a.type || "process")).slice(0, 42)}${
            a.uptime_seconds ? ` · up ${fmtUptime(a.uptime_seconds)}` : ""}</div>
        </div>
        ${a.stoppable === false ? "" :
          `<button class="btn-stop" data-stop="${esc(a.name)}"
             data-kind="${a.stop === "llm" ? "llm" : "app"}">Stop</button>`}
      </div>`).join("")
      : `<div class="empty"><div class="empty-t">Nothing running</div>
           <div class="empty-s">Start something from Repos, or ask the Room.</div></div>`;

    // One row per problem, one action each, the phone is for unblocking.
    const needs = [
      ...(ov.conflicts || []).slice(0, 3).map(k => ({
        name: k.name, metric: `:${k.port} held by ${k.held_by}`,
        action: "Resolve", tone: "err", act: "resolve", port: k.port,
      })),
      ...(ov.failed || []).slice(0, 3).map(f => ({
        name: f.name, metric: f.state || `exit ${f.exit_code}`,
        action: "Open", tone: "err", act: "open",
      })),
      ...(ov.dirty || []).slice(0, 5).map(r => ({
        name: r.name, metric: `${r.changed_count} files uncommitted`,
        action: "Commit", tone: "warn", act: "commit",
      })),
      ...(ov.unsynced || []).slice(0, 3).map(r => ({
        name: r.name, metric: r.behind ? `${r.behind} behind` : `${r.ahead} ahead`,
        action: "Pull", tone: "warn", act: "pull",
      })),
    ].slice(0, 8);

    const needRows = needs.length ? needs.map(n => `
      <div class="need" data-tone="${n.tone}">
        <div class="need-b">
          <div class="need-n">${esc(n.name)}</div>
          <div class="need-m">${esc(n.metric)}</div>
        </div>
        <button class="btn" data-need="${n.act}" data-name="${esc(n.name)}"
          data-tone="${n.act === "resolve" ? "" : n.act === "commit" ? "outline" : "teal"}">${n.action}</button>
      </div>`).join("")
      : `<div class="empty"><div class="empty-t">Nothing needs you</div>
           <div class="empty-s">No conflicts, no failures, nothing uncommitted.</div></div>`;

    const sys = STATE.sys;
    const meter = sys ? `<div class="meter">
        <div class="meter-row">RAM<b data-tone="${sys.ram.percent > 90 ? "err" : sys.ram.percent > 75 ? "warn" : ""}">${
          gb(sys.ram.used_bytes)} / ${gb(sys.ram.total_bytes)} GB</b></div>
        <div class="track">
          <i style="width:${(sys.ram.llm_bytes / sys.ram.total_bytes) * 100}%;background:var(--primary)"></i>
          <i style="width:${(sys.ram.other_bytes / sys.ram.total_bytes) * 100}%;background:var(--live)"></i>
        </div>
        <div class="meter-row" style="margin-top:9px">CPU<b>${Math.round(sys.cpu.busy)}%</b></div>
        <div class="track">
          <i style="width:${Math.max(0, sys.cpu.llm)}%;background:var(--primary)"></i>
          <i style="width:${Math.max(0, sys.cpu.other)}%;background:var(--warn)"></i>
        </div>
      </div>` : "";

    return header("Ops", `${esc(HOSTNAME)} · online`,
        `<button class="hd-btn" data-act="search" aria-label="Search repos">${ICONS.search}</button>`) +
      `<div class="scroll">
        <div class="rule"><span class="dot" style="background:var(--live)"></span>Live
          <span class="n">${c.live || 0} of ${c.apps || 0} up</span></div>
        ${liveCards}
        <div class="rule"><span class="dot" style="background:var(--warn)"></span>Needs you
          <span class="n">${needs.length || ""}</span></div>
        ${needRows}
        <div class="rule">Machine</div>
        ${meter}
      </div>` + tabbar();
  }

  // ---- 2. Repos (search-first) + repo sheet
  function viewRepos() {
    if (STATE.repo || STATE.repoName) return viewRepoSheet();
    const apps = STATE.apps || [];
    const q = STATE.query.trim().toLowerCase();
    const idx = (STATE.overview && STATE.overview.repo_index) || {};
    // Which repos are open in the editor, by name, so a row can say so.
    const openNames = new Set(((STATE.vscode || {}).folders || []).map(f => f.name));
    const filter = STATE.repoFilter || "attention";

    // No 270-row list on a phone: show what needs you first, then search.
    const shown = q
      ? apps.filter(a => a.name.toLowerCase().includes(q)).slice(0, 40)
      : filter === "vscode"
        ? apps.filter(a => openNames.has(a.name)).slice(0, 40)
        : apps.filter(a => a.running || (idx[a.name] && idx[a.name].dirty)).slice(0, 25);

    // Folders open in VSCode that GSO-1 does not know as apps still belong in
    // that list: they are open on the Mac, whatever the scanner thinks.
    const strays = (!q && filter === "vscode")
      ? (((STATE.vscode || {}).folders) || []).filter(f => !apps.some(a => a.name === f.name))
      : [];

    const chips = q ? "" : `<div class="colbar">
        <button class="colbtn" data-repofilter="attention" aria-pressed="${filter === "attention"}">
          Needs you</button>
        <button class="colbtn" data-repofilter="vscode" aria-pressed="${filter === "vscode"}">
          In VSCode${openNames.size ? ` ${openNames.size}` : ""}</button>
      </div>`;

    const rows = shown.map(a => {
      const g = idx[a.name];
      const meta = a.running ? `running${a.port ? ` · :${a.port}` : ""}`
        : g ? (g.dirty ? `<b>${g.changed} changed</b> · ${esc(g.branch || "")}` : `clean · ${esc(g.branch || "")}`)
        : esc(a.root_label || "");
      return `<button class="repo" data-repo="${esc(a.name)}">
        <span class="repo-b"><span class="repo-n">${esc(a.name)}</span>
          <span class="repo-m">${meta}</span></span>
        ${openNames.has(a.name) && filter !== "vscode"
          ? `<span class="tag">editor</span>` : `<span class="chev">&rsaquo;</span>`}
      </button>`;
    }).join("")
      + strays.map(f => `<button class="repo" data-focus="${esc(f.path)}">
          <span class="repo-b"><span class="repo-n">${esc(f.name)}</span>
            <span class="repo-m">open in VSCode &middot; not one of your apps</span></span>
          <span class="chev">&rsaquo;</span>
        </button>`).join("")
      || `<div class="empty"><div class="empty-t">${
          q ? "No match" : filter === "vscode" ? "Nothing open in VSCode" : "Nothing needs attention"}</div>
        <div class="empty-s">${
          q ? "Try another name."
            : filter === "vscode" ? "Windows you open on the Mac show up here."
            : "Search to find any of your repos."}</div></div>`;

    return header("Repos", q ? `${shown.length} matching`
        : filter === "vscode" ? `${openNames.size} open in the editor`
        : "running and uncommitted") +
      `<div class="scroll">
        <input class="search" id="q" type="search" placeholder="Search repos…"
          autocapitalize="off" autocorrect="off" value="${esc(STATE.query)}" />
        ${chips}
        ${rows}
      </div>` + tabbar();
  }

  function viewRepoSheet() {
    const d = STATE.repo;
    if (!d) {
      return header(STATE.repoName || "Repo", "loading…", "", true) +
        `<div class="scroll"><div class="skel" style="width:60%"></div><div class="skel"></div></div>` + tabbar();
    }
    const g = d.git || {}, p = d.process, c = d.config || {};
    const running = !!(p && p.running);
    const failed = (p && !p.running && p.exit_code) || (d.health || {}).state === "crashed";

    const files = g.changed_files || [];
    const git = g.is_repo ? `<div class="card">
        <div class="card-l">Git</div>
        <div class="kv">Branch<b><button class="linkb" data-act="branch">${
          esc(g.branch || "?")} &#9662;</button></b></div>
        <div class="kv">Status<b data-tone="${g.dirty ? "warn" : "live"}">${
          g.dirty ? `${g.changed_count} uncommitted` : "clean"}</b></div>
        <div class="kv">Ahead / behind<b data-tone="${g.ahead ? "warn" : ""}">${g.ahead} / ${g.behind}</b></div>
        <div class="commit">${esc((g.last_commit || "").slice(0, 130))}</div>

        ${g.dirty ? `
          <div class="divide"></div>
          <button class="linkb" data-act="files">${
            STATE.showFiles ? "Hide the file list" : `Show the ${g.changed_count} file${
              g.changed_count === 1 ? "" : "s"} that would be committed`}</button>
          ${STATE.showFiles ? `<div class="files">${files.map(f => {
            const code = f.slice(0, 2).trim() || "??";
            return `<div class="file"><span class="file-x" data-x="${esc(code)}">${esc(code)}</span>${esc(f.slice(3))}</div>`;
          }).join("")}${g.changed_count > files.length
            ? `<div class="file" style="opacity:.6">and ${g.changed_count - files.length} more</div>` : ""}</div>` : ""}
          <div class="pair" style="margin-top:10px">
            <button class="btn" data-act="commit">Commit</button>
            <button class="btn" data-tone="outline" data-act="commitpush">Commit &amp; push</button>
          </div>` : ""}

        <div class="pair" style="margin-top:10px">
          <button class="btn" data-tone="outline" data-act="pull">Pull${g.behind ? ` ${g.behind}` : ""}</button>
          <button class="btn" data-tone="outline" data-act="push" ${g.ahead ? "" : "disabled"}
            >Push${g.ahead ? ` ${g.ahead}` : ""}</button>
        </div>
        ${STATE.gitOut ? `<pre class="log" style="margin-top:10px">${esc(STATE.gitOut)}</pre>` : ""}
      </div>` : "";

    // What this repo is. Never blocks on a model: the measured half renders
    // whether or not one has ever run, exactly as it does on the desktop.
    const sm = STATE.summary;
    const sg = sm && sm.signals;
    const rec = sm && sm.record;
    const yn = (on, label) => `<span class="sig" data-on="${on ? 1 : 0}">${on ? "&#10003;" : "&#10005;"} ${label}</span>`;
    const summary = `<div class="card">
        <div class="card-l">Summary</div>
        ${!sm ? `<div class="sheet-n">Reading&hellip;</div>` : `
          ${rec ? `
            <div class="sum-h">${esc(rec.summary.headline || "")}</div>
            <p class="sum-p">${esc(rec.summary.purpose || "")}</p>
            ${(rec.summary.stack || []).length ? `<div class="chips">${
              rec.summary.stack.map(x => `<span class="chip">${esc(x.name)}</span>`).join("")}</div>` : ""}
            ${(rec.summary.caveats || []).length ? `<div class="sum-s">Worth knowing</div>
              <ul class="caveats">${rec.summary.caveats.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
          ` : ""}
          ${sg ? `<div class="sigs">${yn(sg.tests, "tests")}${yn(sg.ci, "CI")}${yn(sg.lockfile, "lockfile")}${
            sg.license ? `<span class="sig" data-on="1">${esc(sg.license)}</span>` : ""}</div>
            <div class="sum-f">${[sg.last_commit ? `last commit ${esc(sg.last_commit)}` : null,
              sg.files ? `${sg.files} files` : null,
              sg.contributors ? `${sg.contributors} contributor${sg.contributors === 1 ? "" : "s"}` : null
            ].filter(Boolean).join(" &middot; ")}</div>` : ""}
          ${rec && rec.stale ? `<div class="sum-f" data-tone="warn">commits since this was written</div>` : ""}
          ${sm.llm === "running"
            ? `<button class="btn" data-tone="outline" data-act="summarise" style="width:100%;margin-top:10px">${
                rec ? "Rewrite" : "Summarise this repo"}</button>`
            : `<div class="sum-f">Start a local model to have GSO-1 describe this repo.</div>`}
        `}
      </div>`;

    const logs = `<div class="card">
        <div class="card-l">Logs</div>
        ${STATE.logs
          ? `<pre class="log">${esc(STATE.logs)}</pre>`
          : `<button class="linkb" data-act="logs">Load the latest output</button>`}
      </div>`;

    const fail = failed ? `<div class="card" data-tone="err">
        <div class="fail-h"><span class="fail-b">!</span><span class="fail-t">Last run failed</span>
          <span class="fail-w">${p && p.exit_code != null ? `exit ${p.exit_code}` : (d.health || {}).state}</span></div>
        <pre class="log" id="faillog">Reading the log…</pre>
        <button class="btn" data-tone="outline" style="width:100%;border-color:var(--err-line);color:var(--err-text)"
          data-act="askops">Ask Ops Room to fix</button>
      </div>` : "";

    return header(d.name, esc(d.path), `<button class="hd-btn" data-act="fav"
        aria-pressed="${c.favourite ? "true" : "false"}" aria-label="Favourite"
        style="${c.favourite ? "color:var(--primary-text);border-color:var(--primary-line)" : ""}">★</button>`, true) +
      `<div class="scroll">
        <div class="sheet-actions">
          <button class="btn" data-act="run" ${c.start_command ? "" : "disabled"}
            ${running ? 'data-tone="outline" style="border-color:var(--err-line);color:var(--err-text)"' : ""}>${
            running ? "Stop" : "Start"}</button>
          <button class="sq" data-act="vscode" aria-label="Open in VSCode">&#8599;</button>
          <button class="sq" data-act="more" aria-label="More">&#8943;</button>
        </div>
        ${fail}
        ${summary}
        ${git}
        <div class="card">
          <div class="card-l">Run config</div>
          <div class="kv">Start<b>${esc(c.start_command || "not set")}</b></div>
          <div class="kv">Port<b>${c.port || "not set"}</b></div>
          ${p ? `<div class="kv">Process<b>${p.pid} · ${p.running ? `up ${fmtUptime(p.uptime_seconds)}` : `exit ${p.exit_code}`}</b></div>` : ""}
          <div class="kv" style="align-items:center">Favourite
            <button class="switch" data-act="fav" role="switch"
              aria-checked="${c.favourite ? "true" : "false"}" aria-label="Favourite"></button></div>
        </div>
        ${logs}
        ${d.description ? `<div class="card"><div class="card-l">About</div>
          <div style="font-size:13px;line-height:1.55;color:var(--text-2)">${esc(d.description)}</div></div>` : ""}
      </div>` + tabbar();
  }

  // ---- 3. Planner
  function viewPlanner() {
    const boards = STATE.planner;
    if (!boards) {
      return header("Planner", "loading…") + `<div class="scroll"><div class="skel"></div></div>` + tabbar();
    }
    const board = boards.find(b => b.id === STATE.plannerBoard) || boards[0];
    if (!board) {
      return header("Planner", "no boards") +
        `<div class="scroll"><div class="empty"><div class="empty-t">No boards yet</div>
          <div class="empty-s">A board holds tasks in four columns.</div>
          <button class="btn" data-boardmenu="1" style="margin-top:14px">New board</button>
        </div></div>` + tabbar();
    }
    const counts = {};
    COLS.forEach(col => counts[col.id] = board.tasks.filter(t => t.status === col.id).length);
    const tasks = board.tasks.filter(t => t.status === STATE.plannerCol)
      .sort((a, b) => a.order - b.order);

    const boardPills = boards.length > 1 ? `<div class="colbar">${boards.map(b =>
      `<button class="colbtn" data-board="${b.id}" aria-pressed="${b.id === board.id}">${esc(b.name)}</button>`
      ).join("")}</div>` : "";

    return header("Planner", `${esc(board.name)} · ${board.tasks.length} tasks`,
      `<button class="hd-btn" data-newtask="1" aria-label="New task">+</button>
       <button class="hd-btn" data-boardmenu="1" aria-label="Boards">&#8943;</button>`) +
      `<div class="scroll">
        ${boardPills}
        <div class="colbar">${COLS.map(col =>
          `<button class="colbtn" data-col="${col.id}" aria-pressed="${col.id === STATE.plannerCol}">
            ${col.label} ${counts[col.id]}</button>`).join("")}</div>
        ${tasks.map(t => `<button class="task" data-task="${t.id}" data-done="${t.status === "done" ? "1" : "0"}">
            <div class="task-t">${esc(t.title)}</div>
            ${(t.app || t.due) ? `<div class="task-m">
              <span class="task-r">${esc(t.app || "")}</span>
              ${t.due ? `<span class="tag">${esc(t.due)}</span>` : ""}</div>` : ""}
          </button>`).join("") ||
          `<div class="empty"><div class="empty-t">Nothing in ${esc(
            (COLS.find(c => c.id === STATE.plannerCol) || {}).label)}</div>
           <div class="empty-s">Tap a task in another column to move it here.</div></div>`}
      </div>` + tabbar();
  }

  // ---- 5. More: the screens that do not earn a tab of their own
  function viewMore() {
    const llm = STATE.llm || {};
    const running = llm.state === "running";
    const row = (tab, title, note, tone) => `
      <button class="repo" data-go="${tab}">
        <span class="repo-b"><span class="repo-n">${esc(title)}</span>
          <span class="repo-m" ${tone ? `data-tone="${tone}"` : ""}>${note}</span></span>
        <span class="chev">&rsaquo;</span>
      </button>`;
    const jobs = (STATE.schedule || {}).jobs || [];
    const due = jobs.filter(j => j.enabled).length;
    return header("More", "everything else GSO-1 does") +
      `<div class="scroll">
        ${row("llm", "Local LLM", running
            ? `running &middot; ${esc(llm.model || "")}`
            : "stopped", running ? "live" : "")}
        ${row("brain", "Ops Room model", STATE.brain
            ? (STATE.brain.provider === "anthropic"
                ? `Claude &middot; ${STATE.brain.connected ? "connected" : "not connected"}`
                : "the local model")
            : "&hellip;", STATE.brain && STATE.brain.provider === "anthropic"
               && !STATE.brain.connected ? "warn" : "")}
        ${row("sched", "Scheduled jobs", jobs.length
            ? `${due} of ${jobs.length} enabled` : "&hellip;")}
        <div class="card" style="margin-top:14px">
          <div class="card-l">This device</div>
          <div class="kv">Signed in<b>with your phone token</b></div>
          <button class="btn" data-tone="outline" data-act="lock"
            style="width:100%;margin-top:10px">Lock this device</button>
        </div>
      </div>` + tabbar();
  }

  // ---- 6. Local LLM
  function viewLlm() {
    const st = STATE.llm || {};
    const models = STATE.models || [];
    const setup = STATE.llmSetup || {};
    const dl = setup.download || {};
    const rd = STATE.summaryReady || {};
    const run = STATE.summaryRun || {};
    const busy = st.state === "running" || st.state === "loading";

    const server = `<div class="card">
        <div class="card-l">llama-server</div>
        <div class="kv">State<b data-tone="${busy ? "live" : ""}">${esc(st.state || "…")}</b></div>
        <div class="kv">Model<b>${esc(st.model || "none loaded")}</b></div>
        <div class="kv">Port<b>${st.port || "—"}</b></div>
        ${st.uptime_seconds ? `<div class="kv">Uptime<b>${fmtUptime(st.uptime_seconds)}</b></div>` : ""}
        ${busy ? `<button class="btn" data-tone="outline" data-act="llmstop"
          style="width:100%;margin-top:10px;border-color:var(--err-line);color:var(--err-text)">Stop the server</button>` : ""}
        ${!st.server_bin ? `<div class="sum-f" data-tone="warn">llama.cpp is not installed.
          ${esc((setup.install || {}).command || "")}</div>` : ""}
      </div>`;

    const disk = `<div class="card">
        <div class="card-l">Models on disk</div>
        ${models.length ? models.map(m => `
          <button class="repo" data-load="${esc(m.path)}" ${busy ? "disabled" : ""}>
            <span class="repo-b"><span class="repo-n">${esc(m.name)}</span>
              <span class="repo-m">${m.size_gb} GB${
                m.name === st.model ? " &middot; loaded" : ""}</span></span>
            ${m.name === st.model ? "" : `<span class="chev">&rsaquo;</span>`}
          </button>`).join("")
          : `<div class="sheet-n">No .gguf files found yet.</div>`}
      </div>`;

    const cat = (setup.catalog || {}).models || [];
    const get = `<div class="card">
        <div class="card-l">Get a model</div>
        ${dl.state === "running" ? `
          <div class="track"><i style="width:${dl.total ? (dl.done / dl.total) * 100 : 0}%;background:var(--primary)"></i></div>
          <div class="sum-f">${esc(dl.label || "")} &middot; ${(dl.done / 1073741824).toFixed(1)} of ${
            (dl.total / 1073741824).toFixed(1)} GB</div>
          <button class="btn" data-tone="outline" data-act="dlcancel" style="width:100%;margin-top:10px">Stop</button>
        ` : cat.length ? cat.map(m => `
          <button class="repo" data-get="${esc(m.id)}" ${m.on_disk || !m.fits ? "disabled" : ""}>
            <span class="repo-b"><span class="repo-n">${esc(m.label)}</span>
              <span class="repo-m">${m.size_gb} GB &middot; ${
                m.on_disk ? "already here" : m.fits ? esc(m.quant) : "too big for this Mac"}</span></span>
            ${m.on_disk || !m.fits ? "" : `<span class="chev">&rsaquo;</span>`}
          </button>`).join("") : `<div class="sheet-n">Checking what is available&hellip;</div>`}
      </div>`;

    const sum = `<div class="card">
        <div class="card-l">Repo summaries</div>
        ${run.state === "running" ? `
          <div class="track"><i style="width:${run.total ? (run.done / run.total) * 100 : 0}%;background:var(--primary)"></i></div>
          <div class="sum-f">${run.done} of ${run.total}${
            run.current ? ` &middot; ${esc(run.current)}` : ""}${
            run.seconds_left ? ` &middot; ~${Math.round(run.seconds_left / 60)} min left` : ""}</div>
          <button class="btn" data-tone="outline" data-act="sumcancel" style="width:100%;margin-top:10px">Stop</button>
        ` : `
          <div class="kv">Done<b>${rd.summarised || 0} of ${rd.repos || 0}</b></div>
          ${rd.estimate_seconds ? `<div class="sum-f">About ${
            Math.max(1, Math.round(rd.estimate_seconds / 60))} min for the rest, at the speed measured here.</div>` : ""}
          <button class="btn" data-act="sumrun" ${busy ? "" : "disabled"}
            style="width:100%;margin-top:10px">Summarise ${rd.remaining || 0} repo${
            rd.remaining === 1 ? "" : "s"}</button>
          ${busy ? "" : `<div class="sum-f">Load a model first.</div>`}
          ${run.message ? `<div class="sum-f">${esc(run.message)}</div>` : ""}
        `}
      </div>`;

    return header("Local LLM", busy ? `running on :${st.port}` : "stopped", "", true) +
      `<div class="scroll">${server}${disk}${get}${sum}</div>` + tabbar();
  }

  // ---- 7. Which brain answers in the Ops Room
  function viewBrain() {
    const b = STATE.brain;
    if (!b) return header("Ops Room model", "loading…", "", true) +
      `<div class="scroll"><div class="skel"></div></div>` + tabbar();
    const claude = b.provider === "anthropic";
    return header("Ops Room model", claude ? "Claude" : "the local model", "", true) +
      `<div class="scroll">
        <button class="repo" data-prov="local" aria-pressed="${!claude}">
          <span class="repo-b"><span class="repo-n">Local model</span>
            <span class="repo-m">Free and private. Needs one loaded.</span></span>
          ${claude ? "" : `<span class="tag">in use</span>`}
        </button>
        <button class="repo" data-prov="anthropic" aria-pressed="${claude}">
          <span class="repo-b"><span class="repo-n">Claude</span>
            <span class="repo-m">Stronger at multi-step work. Billed to your account.</span></span>
          ${claude ? `<span class="tag">in use</span>` : ""}
        </button>
        ${claude ? `<div class="card" style="margin-top:14px">
          <div class="card-l">Claude</div>
          <div class="kv">Model<b><button class="linkb" data-act="brainmodel">${
            esc(b.model || "claude-sonnet-5")} &#9662;</button></b></div>
          <div class="kv">Connection<b data-tone="${b.connected ? "live" : "warn"}">${
            b.connected ? "connected" : "not connected"}</b></div>
          ${b.connected
            ? `<button class="btn" data-tone="outline" data-act="brainout"
                 style="width:100%;margin-top:10px">Disconnect</button>`
            : `<div class="sum-f">Signing in opens a page in your browser. The
                 sign-in finishes on the Mac running GSO-1, so it is easiest to
                 do it there: Settings, then Ops Room.</div>`}
        </div>` : ""}
      </div>` + tabbar();
  }

  // ---- 8. Scheduled jobs
  function viewSchedule() {
    const sc = STATE.schedule;
    if (!sc) return header("Scheduled jobs", "loading…", "", true) +
      `<div class="scroll"><div class="skel"></div></div>` + tabbar();
    const jobs = sc.jobs || [];
    return header("Scheduled jobs", sc.running ? "scheduler running" : "scheduler stopped", "", true) +
      `<div class="scroll">
        ${jobs.map(j => {
          const last = j.last || {};
          return `<div class="card">
            <div class="kv" style="align-items:center">
              <b style="font-size:14px">${esc(j.name)}</b>
              <button class="switch" data-job="${esc(j.id)}" role="switch"
                aria-checked="${j.enabled ? "true" : "false"}" aria-label="Enabled"></button></div>
            <div class="sum-f">${j.daily_at ? `daily at ${esc(j.daily_at)}` : esc(j.kind || "")}${
              last.last_run ? ` &middot; last ran ${esc(String(last.last_run).replace("T", " ").slice(0, 16))}` : " &middot; never run"}${
              last.last_run ? (last.ok ? "" : " &middot; failed") : ""}</div>
            ${last.detail ? `<pre class="log" style="margin-top:9px;max-height:110px">${
              esc(String(last.detail).slice(0, 600))}</pre>` : ""}
            <button class="btn" data-tone="outline" data-runjob="${esc(j.id)}"
              style="width:100%">Run it now</button>
          </div>`;
        }).join("") || `<div class="empty"><div class="empty-t">No jobs</div>
          <div class="empty-s">Scheduled jobs are configured on the desktop.</div></div>`}
      </div>` + tabbar();
  }

  // ---- 4. Ops Room chat
  function viewRoom() {
    const bubbles = STATE.chat.map(m =>
      m.who === "err" ? `<div class="bub-err">${esc(m.text)}</div>`
        : `<div class="bub" data-who="${m.who}">${esc(m.text)}</div>`).join("");
    const replies = (!STATE.chatBusy && STATE.replies.length)
      ? `<div class="replies">${STATE.replies.map((r, i) =>
          `<button class="reply" data-reply="${i}" ${i === 0 ? 'data-tone="yes"' : ""}>${esc(r)}</button>`).join("")}</div>`
      : "";

    return header("Ops Room", `${esc(MODEL_NAME)} · on your Mac`,
        `<button class="hd-btn" data-act="clear" aria-label="Clear">&#8635;</button>`, false, "live") +
      `<div class="scroll" id="chatscroll">
        <div class="chat" id="chatlog">
          ${bubbles || `<div class="empty" style="padding-top:52px">
            <div class="empty-t">Ask about your machine</div>
            <div class="empty-s">Git state, what is running, what failed, or have it change its own code.
              Runs on the local model; a reply takes ~30s.</div></div>`}
          ${STATE.chatBusy ? `<div class="typing"><i></i><i></i><i></i></div>` : ""}
          ${replies}
        </div>
      </div>
      <div class="composer">
        <textarea id="ask" rows="1" placeholder="Ask about your machine…"
          ${STATE.chatBusy ? "disabled" : ""}></textarea>
        <button class="send" id="sendbtn" ${STATE.chatBusy ? "disabled" : ""} aria-label="Send">&uarr;</button>
      </div>` + tabbar();
  }

  // ---- login gate
  function viewGate(err) {
    return `<div class="gate">
      <img src="/static/favicon.svg" alt="" />
      <h1>GSO-1</h1>
      <p>This Mac is asking for the access code from its <span class="mono">.env</span>
         (<span class="mono">MANAGER_MOBILE_TOKEN</span>). It is stored on this device only.</p>
      <input id="code" type="password" inputmode="text" autocomplete="one-time-code"
        placeholder="Access code" />
      ${err ? `<div class="bub-err">${esc(err)}</div>` : ""}
      <button class="btn" id="unlock">Connect</button>
    </div>`;
  }

  // ---------------------------------------------------------------- render
  let HOSTNAME = "this Mac";
  let MODEL_NAME = "local model";

  function render(gateError) {
    const root = $("#root");
    if (STATE.locked) { root.className = ""; root.innerHTML = viewGate(gateError); return wireGate(); }
    root.className = "app";
    root.innerHTML =
      STATE.tab === "ops" ? viewOps()
      : STATE.tab === "repos" ? viewRepos()
      : STATE.tab === "planner" ? viewPlanner()
      : STATE.tab === "more" ? viewMore()
      : STATE.tab === "llm" ? viewLlm()
      : STATE.tab === "sched" ? viewSchedule()
      : STATE.tab === "brain" ? viewBrain()
      : viewRoom();
    wire();
  }

  function wireGate() {
    $("#unlock").onclick = async () => {
      const token = $("#code").value.trim();
      if (!token) return;
      const res = await fetch("/api/remote/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }), credentials: "same-origin",
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d.ok) { STATE.locked = false; boot(); }
      else render(d.error || "Could not connect.");
    };
    $("#code").onkeydown = (e) => { if (e.key === "Enter") $("#unlock").click(); };
  }

  function wire() {
    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
      STATE.tab = b.dataset.tab;
      STATE.repo = STATE.repoName = null;
      render();
      refresh();
    });

    const q = $("#q");
    if (q) {
      q.oninput = () => { STATE.query = q.value; const at = q.selectionStart; render();
        const nq = $("#q"); if (nq) { nq.focus(); nq.setSelectionRange(at, at); } };
    }

    document.querySelectorAll("[data-repo]").forEach(b =>
      b.onclick = () => openRepo(b.dataset.repo));

    document.querySelectorAll("[data-stop]").forEach(b => b.onclick = async () => {
      b.disabled = true; b.textContent = "…";
      try {
        if (b.dataset.kind === "llm") await api("/api/llm/stop", { method: "POST" });
        else await api(`/api/apps/${encodeURIComponent(b.dataset.stop)}/stop`, { method: "POST" });
        toast(`${b.dataset.stop}, stopped`);
        await loadOverview(true); render();
      } catch (e) { toast(`Could not stop it: ${e.message}`, "error"); }
    });

    document.querySelectorAll("[data-need]").forEach(b => b.onclick = () => needAction(b));
    document.querySelectorAll("[data-board]").forEach(b =>
      b.onclick = () => { STATE.plannerBoard = b.dataset.board; render(); });
    document.querySelectorAll("[data-col]").forEach(b =>
      b.onclick = () => { STATE.plannerCol = b.dataset.col; render(); });
    document.querySelectorAll("[data-task]").forEach(b =>
      b.onclick = () => moveTask(b.dataset.task));
    document.querySelectorAll("[data-reply]").forEach(b =>
      b.onclick = () => ask(STATE.replies[Number(b.dataset.reply)]));

    document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => sheetAction(b.dataset.act));

    // ---- More, and the screens it leads to
    document.querySelectorAll("[data-repofilter]").forEach(b => b.onclick = () => {
      STATE.repoFilter = b.dataset.repofilter;
      render();
    });
    document.querySelectorAll("[data-focus]").forEach(b => b.onclick = async () => {
      try {
        await api("/api/vscode/focus-path", {
          method: "POST", body: JSON.stringify({ path: b.dataset.focus }) });
        toast("Brought to the front on your Mac");
      } catch (e) { toast(e.message, "error"); }
    });
    document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
      STATE.tab = b.dataset.go; render(); refresh();
    });
    document.querySelectorAll("[data-load]").forEach(b => b.onclick = () => loadModel(b.dataset.load));
    document.querySelectorAll("[data-get]").forEach(b => b.onclick = () => getModel(b.dataset.get));
    document.querySelectorAll("[data-prov]").forEach(b => b.onclick = () => setProvider(b.dataset.prov));
    document.querySelectorAll("[data-job]").forEach(b => b.onclick = () => toggleJob(b.dataset.job));
    document.querySelectorAll("[data-runjob]").forEach(b => b.onclick = () => runJob(b.dataset.runjob));

    // ---- planner writes
    document.querySelectorAll("[data-newtask]").forEach(b => b.onclick = () => newTask());
    document.querySelectorAll("[data-boardmenu]").forEach(b => b.onclick = () => boardMenu());

    const send = $("#sendbtn");
    if (send) send.onclick = () => ask($("#ask").value);
    const ta = $("#ask");
    if (ta) {
      ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(130, ta.scrollHeight) + "px"; };
      if (!STATE.chatBusy && STATE.chat.length) scrollChat();
    }
    const fl = $("#faillog");
    if (fl && STATE.repoName) {
      api(`/api/apps/${encodeURIComponent(STATE.repoName)}/logs`)
        .then(t => { fl.textContent = (String(t).trim().split("\n").slice(-8).join("\n")) || "No output captured."; })
        .catch(() => { fl.textContent = "Could not read the log."; });
    }
  }

  function scrollChat() {
    const s = $("#chatscroll");
    if (s) s.scrollTop = s.scrollHeight;
  }

  // ---------------------------------------------------------------- actions
  async function openRepo(name) {
    STATE.tab = "repos"; STATE.repoName = name; STATE.repo = null;
    STATE.summary = null; STATE.logs = null; STATE.gitOut = null; STATE.showFiles = false;
    render();
    // The summary may need a model that is not running, so it is fetched
    // beside the repo rather than before it: the sheet must paint either way.
    api(`/api/apps/${encodeURIComponent(name)}/summary`)
      .then(v => { if (STATE.repoName === name) { STATE.summary = v; render(); } })
      .catch(() => { if (STATE.repoName === name) { STATE.summary = {}; render(); } });
    try { STATE.repo = await api(`/api/apps/${encodeURIComponent(name)}`); }
    catch (e) { toast(e.message, "error"); }
    render();
  }

  async function needAction(btn) {
    const name = btn.dataset.name, act = btn.dataset.need;
    btn.disabled = true; btn.textContent = "…";
    try {
      if (act === "open" || act === "resolve") {
        if (act === "resolve") {
          // Free the port by stopping whatever GSO-1 has on it, then open the repo.
          const holder = (STATE.overview.conflicts || []).find(c => c.name === name);
          const owner = holder && (STATE.overview.live || []).find(l => l.port === holder.port);
          if (owner && owner.stoppable !== false) {
            await api(`/api/apps/${encodeURIComponent(owner.name)}/stop`, { method: "POST" });
            toast(`Freed :${holder.port}, ${owner.name} stopped`);
            await loadOverview(true); return render();
          }
        }
        return openRepo(name);
      }
      if (act === "commit") {
        await api(`/api/apps/${encodeURIComponent(name)}/commit`, {
          method: "POST", body: JSON.stringify({ message: `Update ${name} via GSO-1 mobile` }) });
        toast(`${name}, committed`);
      }
      if (act === "pull") {
        await api(`/api/apps/${encodeURIComponent(name)}/update`, { method: "POST" });
        toast(`${name}, pulled`);
      }
      await loadOverview(true); render();
    } catch (e) {
      toast(`${act} failed: ${e.message}`, "error");
      render();
    }
  }

  async function sheetAction(act) {
    if (act === "back") {
      // The Local LLM, Ops Room and Schedule screens are reached from More, so
      // back belongs there rather than wherever the tab bar last was.
      if (["llm", "brain", "sched"].includes(STATE.tab)) { STATE.tab = "more"; return render(); }
      STATE.repo = STATE.repoName = null; return render();
    }
    if (act === "lock") {
      document.cookie = "gso_token=; Max-Age=0; path=/";
      STATE.locked = true; return render();
    }
    if (act === "search") { STATE.tab = "repos"; render(); const q = $("#q"); if (q) q.focus(); return; }
    if (act === "clear") {
      STATE.chat = []; STATE.replies = []; render();
      api("/api/opsroom/history/clear?session=dock", { method: "POST" })
        .then(() => toast("Conversation cleared")).catch(() => {});
      return;
    }

    // Actions that belong to a screen rather than to a repository. These have
    // to be handled before the guard below, which exists for the repo sheet:
    // falling through it made Stop the server, and every other control on the
    // Local LLM screen, a button that did nothing at all.
    if (act === "brainmodel" || act === "brainout") {
      try {
        if (act === "brainmodel") {
          const models = (STATE.brain || {}).models || [];
          const pick = await choose("Claude model", models.map(m => ({
            value: m.id, label: m.id, current: m.id === (STATE.brain || {}).model,
          })), { note: "Sonnet is the sensible default for tool calls." });
          if (!pick) return;
          await api("/api/opsroom/provider", {
            method: "POST", body: JSON.stringify({ provider: "anthropic", model: pick }) });
          toast(`Ops Room will use ${pick}`);
        } else {
          const sure = await choose("Disconnect Claude?",
            [{ value: "yes", label: "Disconnect and delete the token" }],
            { note: "You would sign in again on the Mac." });
          if (sure !== "yes") return;
          await api("/api/opsroom/logout", { method: "POST" });
          toast("Disconnected");
        }
        await loadBrain();
      } catch (e) { toast(e.message, "error"); }
      return;
    }
    if (act === "llmstop" || act === "sumrun" || act === "sumcancel" || act === "dlcancel") {
      try {
        if (act === "llmstop") {
          const r = await api("/api/llm/stop", { method: "POST" });
          toast(r.message || "Stopped", r.ok ? "info" : "error");
          STATE.llm = await api("/api/llm/status");
        } else if (act === "sumrun") {
          const r = await api("/api/summary/run", { method: "POST", body: JSON.stringify({}) });
          toast(r.message, r.ok ? "info" : "error");
          if (r.ok) { STATE.summaryRun = { state: "running", done: 0, total: r.total || 0 };
                      watchSummaryRun(); }
        } else if (act === "sumcancel") {
          await api("/api/summary/run/cancel", { method: "POST" });
          toast("Stopping\u2026");
        } else if (act === "dlcancel") {
          await api("/api/llm/download/cancel", { method: "POST" });
          toast("Stopping the download\u2026");
        }
      } catch (e) { toast(e.message, "error"); }
      return render();
    }

    const name = STATE.repoName;
    if (!name) return;
    const d = STATE.repo || {};
    try {
      if (act === "run") {
        const running = !!(d.process && d.process.running);
        await api(`/api/apps/${encodeURIComponent(name)}/${running ? "stop" : "start"}`, { method: "POST" });
        toast(`${name}, ${running ? "stopped" : "started"}`);
      } else if (act === "vscode") {
        await api(`/api/apps/${encodeURIComponent(name)}/vscode/open`, { method: "POST" });
        toast(`Opening ${name} in VSCode on your Mac`);
      } else if (act === "fav") {
        await api(`/api/apps/${encodeURIComponent(name)}/favourite`, { method: "POST" });
      } else if (act === "commit" || act === "commitpush") {
        // A message is asked for rather than generated. "Update X via GSO-1
        // mobile" is what a commit log looks like when nobody was paying
        // attention, and these commits are as real as any other.
        const msg = await askText(act === "commitpush" ? "Commit and push" : "Commit", {
          note: `Everything uncommitted in ${name} is staged.`,
          placeholder: "What changed", ok: act === "commitpush" ? "Commit & push" : "Commit" });
        if (!msg || !msg.trim()) return;
        const r = await api(`/api/apps/${encodeURIComponent(name)}/commit`, {
          method: "POST", body: JSON.stringify({ message: msg.trim() }) });
        STATE.gitOut = r.output || "";
        if (r.nochange) toast("Nothing to commit");
        else if (act === "commitpush") {
          const pr = await api(`/api/apps/${encodeURIComponent(name)}/push`, { method: "POST" });
          STATE.gitOut = `${r.output || ""}\n\n${pr.output || ""}`.trim();
          toast(`${name}, committed and pushed`);
        } else toast(`${name}, committed`);
      } else if (act === "push") {
        const r = await api(`/api/apps/${encodeURIComponent(name)}/push`, { method: "POST" });
        STATE.gitOut = r.output || "";
        toast(`${name}, pushed`);
      } else if (act === "pull") {
        const r = await api(`/api/apps/${encodeURIComponent(name)}/update`, { method: "POST" });
        STATE.gitOut = r.output || "";
        toast(`${name}, pulled`);
      } else if (act === "files") {
        STATE.showFiles = !STATE.showFiles;
        return render();
      } else if (act === "branch") {
        const data = await api(`/api/apps/${encodeURIComponent(name)}/branches`);
        const pick = await choose("Switch branch", (data.branches || []).map(b => ({
          value: b.name, label: b.name, current: b.current,
          tag: b.current ? "on this" : b.remote_only ? "remote" : "",
        })), { note: data.total > (data.branches || []).length
          ? `${data.total} branches, newest first.` : "" });
        if (!pick) return;
        const r = await api(`/api/apps/${encodeURIComponent(name)}/checkout`, {
          method: "POST", body: JSON.stringify({ branch: pick }) });
        STATE.gitOut = r.output || "";
        toast(`On ${pick}`);
      } else if (act === "summarise") {
        toast("Reading the repo\u2026");
        await api(`/api/apps/${encodeURIComponent(name)}/summary`, {
          method: "POST", body: JSON.stringify({ force: true }) });
        STATE.summary = await api(`/api/apps/${encodeURIComponent(name)}/summary`);
        toast("Summarised");
        return render();
      } else if (act === "logs") {
        STATE.logs = (await api(`/api/apps/${encodeURIComponent(name)}/logs`)) || "(no output)";
        return render();
      } else if (act === "askops") {
        STATE.tab = "room";
        render();
        return ask(`The repo "${name}" at ${d.path} failed its last run. Read its logs, find the cause and tell me the fix.`);
      } else if (act === "more") {
        const pick = await choose(name, [
          { value: "config", label: "Edit start command / port" },
          ...(d.config && d.config.setup_command
            ? [{ value: "setup", label: "Run setup / install" }] : []),
          { value: "refresh", label: "Refresh" },
        ]);
        if (pick === "config") {
          const cmd = await askText("Start command", {
            value: (d.config || {}).start_command || "",
            placeholder: "npm run dev", ok: "Save" });
          if (cmd === null) return;
          const port = await askText("Port", {
            note: "Leave blank if it does not serve one.",
            value: (d.config || {}).port || "", ok: "Save" });
          if (port === null) return;
          await api(`/api/apps/${encodeURIComponent(name)}/config`, {
            method: "PUT", body: JSON.stringify({
              start_command: cmd.trim() || null,
              port: port.trim() ? parseInt(port, 10) : null }) });
          toast("Saved");
        } else if (pick === "setup") {
          await api(`/api/apps/${encodeURIComponent(name)}/setup`, { method: "POST" });
          toast("Setup running; check the logs card");
        } else if (pick !== "refresh") return;
      }
      STATE.repo = await api(`/api/apps/${encodeURIComponent(name)}`);
      loadOverview(true).catch(() => {});
      render();
    } catch (e) { toast(`${act} failed: ${e.message}`, "error"); }
  }

  // ---- loading the new screens -------------------------------------------
  async function loadLlmScreen() {
    // Status first so the card paints, then the slow parts as they land: the
    // catalog resolves against Hugging Face and the readiness call counts repos.
    try { STATE.llm = await api("/api/llm/status"); render(); } catch (e) {}
    api("/api/llm/models").then(d => { STATE.models = d.models || []; render(); }).catch(() => {});
    api("/api/llm/setup").then(d => { STATE.llmSetup = d; render();
      if ((d.download || {}).state === "running") watchDownload(); }).catch(() => {});
    api("/api/summary/readiness").then(d => { STATE.summaryReady = d; render(); }).catch(() => {});
    api("/api/summary/run").then(d => { STATE.summaryRun = d; render();
      if (d.state === "running") watchSummaryRun(); }).catch(() => {});
  }

  let _dlPoll = null;
  function watchDownload() {
    if (_dlPoll) return;
    _dlPoll = setInterval(async () => {
      let d; try { d = await api("/api/llm/download"); } catch (e) { return; }
      STATE.llmSetup = { ...(STATE.llmSetup || {}), download: d };
      if (d.state !== "running") {
        clearInterval(_dlPoll); _dlPoll = null;
        toast(d.message || "Download finished", d.state === "done" ? "info" : "error");
        api("/api/llm/models").then(x => { STATE.models = x.models || []; render(); }).catch(() => {});
      }
      if (STATE.tab === "llm") render();
    }, 1500);
  }

  let _sumPoll = null;
  function watchSummaryRun() {
    if (_sumPoll) return;
    _sumPoll = setInterval(async () => {
      let d; try { d = await api("/api/summary/run"); } catch (e) { return; }
      STATE.summaryRun = d;
      if (d.state !== "running") {
        clearInterval(_sumPoll); _sumPoll = null;
        if (d.message) toast(d.message, d.state === "done" ? "info" : "error");
        api("/api/summary/readiness").then(x => { STATE.summaryReady = x; render(); }).catch(() => {});
      }
      if (STATE.tab === "llm") render();
    }, 2000);
  }

  async function loadBrain() {
    try { STATE.brain = await api("/api/opsroom/provider"); }
    catch (e) { STATE.brain = { provider: "local", connected: false, models: [] }; }
    render();
  }

  async function loadSchedule() {
    try { STATE.schedule = await api("/api/schedule"); } catch (e) { STATE.schedule = { jobs: [] }; }
    render();
  }

  // ---- Local LLM actions --------------------------------------------------
  async function loadModel(path) {
    const model = (STATE.models || []).find(m => m.path === path);
    if (!model) return;
    const go = await choose(model.name, [{ value: "load", label: `Load this model (${model.size_gb} GB)` }],
      { note: "It uses the flags it was last started with." });
    if (go !== "load") return;
    try {
      toast("Starting the server\u2026");
      const r = await api("/api/llm/start", {
        method: "POST", body: JSON.stringify({ ...(model.preset || {}), model_path: path }) });
      toast(r.message || "Starting", r.ok ? "info" : "error");
      setTimeout(() => api("/api/llm/status").then(v => { STATE.llm = v; render(); }).catch(() => {}), 2500);
    } catch (e) { toast(e.message, "error"); }
  }

  async function getModel(id) {
    const m = (((STATE.llmSetup || {}).catalog || {}).models || []).find(x => x.id === id);
    if (!m) return;
    const go = await choose(m.label, [{ value: "go", label: `Download ${m.size_gb} GB` }],
      { note: `Saved into ${esc(((STATE.llmSetup || {}).catalog || {}).dest || "your model folder")}. It resumes if interrupted.` });
    if (go !== "go") return;
    try {
      const r = await api("/api/llm/download", { method: "POST", body: JSON.stringify({ id }) });
      toast(r.message, r.ok ? "info" : "error");
      STATE.llmSetup = { ...(STATE.llmSetup || {}),
        download: { state: "running", id, label: m.label, done: 0, total: m.size_bytes } };
      watchDownload(); render();
    } catch (e) { toast(e.message, "error"); }
  }

  async function setProvider(which) {
    if (STATE.brain && STATE.brain.provider === which) return;
    try {
      await api("/api/opsroom/provider", { method: "POST", body: JSON.stringify({ provider: which }) });
      toast(which === "anthropic" ? "Ops Room will use Claude" : "Ops Room will use the local model");
      await loadBrain();
    } catch (e) { toast(e.message, "error"); }
  }

  // ---- scheduled jobs -----------------------------------------------------
  async function toggleJob(id) {
    const job = ((STATE.schedule || {}).jobs || []).find(j => j.id === id);
    if (!job) return;
    try {
      await api(`/api/schedule/${encodeURIComponent(id)}/enabled`, {
        method: "POST", body: JSON.stringify({ enabled: !job.enabled }) });
      await loadSchedule();
    } catch (e) { toast(e.message, "error"); }
  }

  async function runJob(id) {
    const job = ((STATE.schedule || {}).jobs || []).find(j => j.id === id);
    const go = await choose(job ? job.name : "Run job",
