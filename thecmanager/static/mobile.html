      [{ value: "run", label: "Run it now" }],
      { note: "It runs on the Mac and reports back here." });
    if (go !== "run") return;
    try {
      toast("Running\u2026");
      await api(`/api/schedule/${encodeURIComponent(id)}/run`, { method: "POST" });
      await loadSchedule();
      toast("Done");
    } catch (e) { toast(e.message, "error"); }
  }

  // ---- planner writes -----------------------------------------------------
  function currentBoard() {
    return (STATE.planner || []).find(b => b.id === STATE.plannerBoard)
      || (STATE.planner || [])[0] || null;
  }

  async function newTask() {
    const board = currentBoard();
    if (!board) return;
    const col = COLS.find(c => c.id === STATE.plannerCol) || COLS[0];
    const title = await askText("New task", {
      note: `Added to ${col.label} on ${board.name}.`,
      placeholder: "What needs doing", ok: "Add" });
    if (!title || !title.trim()) return;
    try {
      await api(`/api/planner/boards/${board.id}/tasks`, {
        method: "POST", body: JSON.stringify({ title: title.trim(), status: col.id }) });
      await loadPlanner(); render();
      toast("Added");
    } catch (e) { toast(e.message, "error"); }
  }

  async function boardMenu() {
    const board = currentBoard();
    const pick = await choose("Boards", [
      { value: "new", label: "New board" },
      ...(board ? [
        { value: "rename", label: `Rename "${board.name}"` },
        { value: "link", label: board.app ? `Linked to ${board.app}` : "Link to an app" },
        { value: "delete", label: `Delete "${board.name}"` },
      ] : []),
    ]);
    if (!pick) return;
    try {
      if (pick === "new") {
        const name = await askText("New board", { placeholder: "Board name", ok: "Create" });
        if (!name || !name.trim()) return;
        const r = await api("/api/planner/boards", {
          method: "POST", body: JSON.stringify({ name: name.trim() }) });
        await loadPlanner();
        if (r.board) STATE.plannerBoard = r.board.id;
        toast("Board created");
      } else if (pick === "rename") {
        const name = await askText("Rename board", { value: board.name, ok: "Rename" });
        if (!name || !name.trim()) return;
        await api(`/api/planner/boards/${board.id}`, {
          method: "PUT", body: JSON.stringify({ name: name.trim() }) });
        await loadPlanner();
      } else if (pick === "link") {
        const app = await askText("Link to an app", {
          note: "The app's exact name, or blank to unlink.",
          value: board.app || "", ok: "Link" });
        if (app === null) return;
        await api(`/api/planner/boards/${board.id}`, {
          method: "PUT", body: JSON.stringify({ app: app.trim() || null }) });
        await loadPlanner();
      } else if (pick === "delete") {
        // Deleting takes the tasks with it, so it is confirmed by name rather
        // than by a yes/no somebody taps through on a phone.
        const sure = await choose(`Delete "${board.name}"?`,
          [{ value: "yes", label: `Delete it and its ${board.tasks.length} task${
            board.tasks.length === 1 ? "" : "s"}` }],
          { note: "This cannot be undone." });
        if (sure !== "yes") return;
        await api(`/api/planner/boards/${board.id}`, { method: "DELETE" });
        STATE.plannerBoard = null;
        await loadPlanner();
        toast("Board deleted");
      }
      render();
    } catch (e) { toast(e.message, "error"); }
  }

  async function moveTask(id) {
    const board = currentBoard();
    if (!board) return;
    const task = board.tasks.find(t => t.id === id);
    if (!task) return;

    // Advancing a column stays the first option, because it is what a tap on a
    // task nearly always means. Everything else a task can need is under it,
    // rather than only on the desktop.
    const i = COLS.findIndex(c => c.id === task.status);
    const next = i < COLS.length - 1 ? COLS[i + 1] : null;
    const back = i > 0 ? COLS[i - 1] : null;

    const pick = await choose(task.title, [
      ...(next ? [{ value: `to:${next.id}`, label: `Move to ${next.label}` }] : []),
      ...(back ? [{ value: `to:${back.id}`, label: `Back to ${back.label}` }] : []),
      { value: "edit", label: "Edit the title" },
      { value: "app", label: task.app ? `Linked to ${task.app}` : "Link to an app" },
      { value: "delete", label: "Delete this task" },
    ]);
    if (!pick) return;

    try {
      if (pick.startsWith("to:")) {
        const status = pick.slice(3);
        await api(`/api/planner/boards/${board.id}/tasks/${id}/move`, {
          method: "PUT", body: JSON.stringify({ status, index: 0 }) });
        toast(`Moved to ${(COLS.find(c => c.id === status) || {}).label}`);
      } else if (pick === "edit") {
        const title = await askText("Edit task", { value: task.title, ok: "Save" });
        if (!title || !title.trim()) return;
        await api(`/api/planner/boards/${board.id}/tasks/${id}`, {
          method: "PUT", body: JSON.stringify({ title: title.trim() }) });
      } else if (pick === "app") {
        const app = await askText("Link to an app", {
          note: "The app's exact name, or blank to unlink.",
          value: task.app || "", ok: "Link" });
        if (app === null) return;
        await api(`/api/planner/boards/${board.id}/tasks/${id}`, {
          method: "PUT", body: JSON.stringify({ app: app.trim() || null }) });
      } else if (pick === "delete") {
        await api(`/api/planner/boards/${board.id}/tasks/${id}`, { method: "DELETE" });
        toast("Deleted");
      }
      await loadPlanner(); render();
    } catch (e) { toast(e.message, "error"); }
  }

  // ---- Ops Room over SSE. The cookie carries the token; EventSource cannot
  // set headers, which is exactly why login sets one.
  let es = null;
  /* Same reasoning as the desktop dock: a question typed here means the user
     wants an answer, and refusing it because nothing is loaded, when the app
     knows exactly what to load, is a dead end rather than an error. */
  async function offerToStart(text) {
    const st = STATE.opsStatus || {};
    if (st.provider === "anthropic") {
      STATE.chat.push({ who: "err", text:
        "The Ops Room is set to use Claude, but no account is connected. Sign in on the Mac: Settings, then Ops Room." });
      return true;
    }
    if (!st.has_llama) {
      STATE.chat.push({ who: "err", text:
        "llama.cpp is not installed on the Mac yet. More, then Local LLM, has the command." });
      return true;
    }
    if (!st.startable) {
      STATE.chat.push({ who: "err", text: st.has_models
        ? "No model is running. Load one from More, then Local LLM."
        : "No model on the Mac yet. More, then Local LLM, can download one." });
      return true;
    }
    const m = st.startable;
    const go = await choose("No model is running", [
      { value: "start", label: `Start ${m.name}`, tag: `${m.size_gb || "?"} GB` },
    ], { note: "It loads on the Mac, then your question is asked." });
    if (go !== "start") return true;

    STATE.chat.push({ who: "agent", text: `Loading ${m.name}\u2026` });
    render();
    try {
      const r = await api("/api/llm/start", {
        method: "POST", body: JSON.stringify({ model_path: m.path }) });
      if (!r.ok) { STATE.chat.push({ who: "err", text: r.message || "Could not start it." }); render(); return true; }
    } catch (e) {
      STATE.chat.push({ who: "err", text: e.message }); render(); return true;
    }
    // Poll rather than guess: a big model takes a while to answer /health.
    for (let i = 0; i < 150; i++) {
      await new Promise(r => setTimeout(r, 2000));
      let st2; try { st2 = await api("/api/llm/status"); } catch (e) { continue; }
      if (st2.state === "running") {
        STATE.llm = st2;
        STATE.chat.pop();               // drop the "Loading…" line
        render();
        ask(text, true);                // and finally ask what was waiting
        return true;
      }
    }
    STATE.chat.push({ who: "err", text: "It is taking longer than expected; check More, then Local LLM." });
    render();
    return true;
  }

  function ask(text, echoed) {
    text = (text || "").trim();
    if (!text || STATE.chatBusy) return;
    const os = STATE.opsStatus;
    if (!echoed && os && os.available && os.llm_state
        && os.llm_state !== "running" && os.llm_state !== "loading") {
      STATE.chat.push({ who: "user", text });
      const ta = $("#ask"); if (ta) ta.value = "";
      render();
      offerToStart(text);
      return;
    }
    if (!echoed) STATE.chat.push({ who: "user", text });
    STATE.replies = [];
    STATE.chatBusy = true;
    render();
    const ta = $("#ask"); if (ta) ta.value = "";

    const out = { who: "agent", text: "" };
    STATE.chat.push(out);
    es = new EventSource(`/api/opsroom/ask?prompt=${encodeURIComponent(text)}`);
    es.addEventListener("output", (e) => {
      out.text += (out.text ? "\n" : "") + e.data;
      const log = $("#chatlog");
      if (log) {
        const bubs = log.querySelectorAll('.bub[data-who="agent"]');
        const last = bubs[bubs.length - 1];
        if (last) { last.textContent = out.text; scrollChat(); }
      }
    });
    es.addEventListener("error", (e) => { if (e.data) STATE.chat.push({ who: "err", text: e.data }); finish(); });
    es.addEventListener("done", finish);
    es.onerror = finish;
  }
  function finish() {
    if (es) { es.close(); es = null; }
    STATE.chatBusy = false;
    STATE.replies = ["Yes, do it", "Show me the log", "Not now"];
    render();
    scrollChat();
  }

  // ---------------------------------------------------------------- boot
  async function refresh() {
    try {
      if (STATE.tab === "ops") {
        await Promise.all([
          loadOverview(),
          api("/api/llm/metrics").then(s => { if (s && !s.warming) STATE.sys = s; }).catch(() => {}),
        ]);
      }
      if (STATE.tab === "repos" && !STATE.apps) await Promise.all([loadApps(), loadOverview()]);
      // Which windows are open changes constantly, so it is refetched with the
      // tab rather than cached like the app list.
      if (STATE.tab === "repos" && !STATE.repoName) {
        api("/api/vscode/folders").then(v => { STATE.vscode = v; render(); }).catch(() => {});
      }
      if (STATE.tab === "planner" && !STATE.planner) await loadPlanner();
      // The Room needs to know whether anything can answer before it sends a
      // question, so it can offer to start one instead of failing.
      if (STATE.tab === "room") {
        api("/api/opsroom/status").then(v => { STATE.opsStatus = v; render(); }).catch(() => {});
        // The phone joins the same conversation as the dock rather than
        // starting its own: asking on the Mac and following up on the sofa is
        // the whole point of the thing remembering.
        if (!STATE.chatLoaded) {
          STATE.chatLoaded = true;
          api("/api/opsroom/history?session=dock").then(d => {
            const msgs = (d && d.messages) || [];
            if (msgs.length && !STATE.chat.length) {
              STATE.chat = msgs.map(m => ({ who: m.who, text: m.text }));
              render();
            }
          }).catch(() => {});
        }
      }
      // The More screen summarises three others, so it needs their state before
      // it can say anything useful about them.
      if (STATE.tab === "more") {
        if (!STATE.llm) api("/api/llm/status").then(v => { STATE.llm = v; render(); }).catch(() => {});
        if (!STATE.brain) loadBrain();
        if (!STATE.schedule) loadSchedule();
      }
      if (STATE.tab === "llm" && !STATE.models) await loadLlmScreen();
      if (STATE.tab === "brain" && !STATE.brain) await loadBrain();
      if (STATE.tab === "sched" && !STATE.schedule) await loadSchedule();
      render();
    } catch (e) {
      if (e.message !== "locked") toast(e.message, "error");
    }
  }

  async function boot() {
    try {
      const st = await api("/api/remote/status");
      STATE.locked = false;
      if (st.loopback) HOSTNAME = "this Mac";
    } catch (e) {
      if (e.message === "locked") return;     // render() already switched to the gate
      STATE.locked = true; return render();
    }
    api("/api/llm/status").then(s => { if (s && s.model) MODEL_NAME = s.model.split("-").slice(0, 2).join("-"); }).catch(() => {});
    render();
    await refresh();
    // Keep the Ops tab honest without hammering: the overview is cached at 45s.
    setInterval(() => { if (STATE.tab === "ops" && !document.hidden) refresh(); }, 20000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  }
