<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Manager</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0b0f17; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #2a3346; border-radius: 6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body class="text-slate-200">
  <div class="max-w-7xl mx-auto p-5">
    <!-- Header -->
    <header class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <span>🗂️</span> The Manager
        </h1>
        <p class="text-sm text-slate-400" id="subtitle">Loading…</p>
      </div>
      <div class="flex items-center gap-3">
        <input id="search" type="text" placeholder="Search apps…"
          class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm w-64 focus:outline-none focus:border-indigo-500" />
        <button id="refresh" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-3 py-2 text-sm">↻ Refresh</button>
      </div>
    </header>

    <!-- View tabs -->
    <div id="views" class="flex items-center gap-2 mb-3 border-b border-slate-800 pb-2"></div>

    <!-- Filter pills -->
    <div id="filters" class="flex flex-wrap gap-2 mb-4 text-xs"></div>

    <!-- App grid -->
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </div>

  <!-- Task editor modal -->
  <div id="task-modal" class="fixed inset-0 z-[55] hidden">
    <div id="task-modal-bg" class="absolute inset-0 bg-black/60"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-slate-900 border border-slate-700 rounded-xl shadow-2xl p-6">
      <div id="task-modal-content"></div>
    </div>
  </div>

  <!-- Detail drawer -->
  <div id="drawer" class="fixed inset-0 z-50 hidden">
    <div id="drawer-bg" class="absolute inset-0 bg-black/60"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-2xl bg-slate-900 border-l border-slate-700 shadow-2xl overflow-y-auto">
      <div id="drawer-content" class="p-6"></div>
    </div>
  </div>

  <script>
    const $ = (s, r=document) => r.querySelector(s);
    const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
    const api = (p, opt) => fetch(p, opt).then(r => r.json());
    let ALL = [];
    let VSCODE = [];                // folders open in VS Code
    let LLM = {};                   // llama.cpp server status
    let MODELS = [];                // available GGUF models
    let PLANNER = {boards: []};     // kanban boards + tasks
    let activeBoardId = null;       // currently shown board
    let activeType = "all";
    let activeView = "favourites";  // home shows favourites by default
    let setupPoll = null;           // interval id for the running setup job
    let llmPoll = null;             // interval id for llm status/log polling
    let metricsPoll = null;         // interval id for system load polling
    let modelsLoaded = false;       // lazy-load the model list once

    const TYPE_COLORS = {
      node: "bg-green-900/40 text-green-300 border-green-700",
      django: "bg-emerald-900/40 text-emerald-300 border-emerald-700",
      streamlit: "bg-red-900/40 text-red-300 border-red-700",
      fastapi: "bg-teal-900/40 text-teal-300 border-teal-700",
      flask: "bg-cyan-900/40 text-cyan-300 border-cyan-700",
      python: "bg-blue-900/40 text-blue-300 border-blue-700",
      rust: "bg-orange-900/40 text-orange-300 border-orange-700",
      go: "bg-sky-900/40 text-sky-300 border-sky-700",
      static: "bg-purple-900/40 text-purple-300 border-purple-700",
      script: "bg-yellow-900/40 text-yellow-300 border-yellow-700",
      make: "bg-pink-900/40 text-pink-300 border-pink-700",
      unknown: "bg-slate-800 text-slate-400 border-slate-700",
    };
    const typeClass = t => TYPE_COLORS[t] || TYPE_COLORS.unknown;

    async function load() {
      const [data, vsc, llm, plan] = await Promise.all([
        api("/api/apps"),
        api("/api/vscode/folders").catch(() => ({folders:[]})),
        api("/api/llm/status").catch(() => ({})),
        api("/api/planner").catch(() => ({boards:[]})),
      ]);
      ALL = data.apps;
      VSCODE = vsc.folders || [];
      LLM = llm || {};
      PLANNER = plan && plan.boards ? plan : {boards: []};
      if (!activeBoardId && PLANNER.boards.length) activeBoardId = PLANNER.boards[0].id;
      $("#subtitle").textContent =
        `${data.count} apps in ${data.projects_dir}`;
      renderViews();
      renderFilters();
      render();
    }

    function favCount() { return ALL.filter(a => a.favourite).length; }

    // Apps in the current view (favourites vs all), before type/search filters.
    function viewApps() {
      return activeView === "favourites" ? ALL.filter(a => a.favourite) : ALL;
    }

    function renderViews() {
      const llmDot = LLM.state === "running" ? "🟢" : LLM.state === "loading" ? "🟡" : "⚪";
      const tabs = [
        { id: "favourites", label: `⭐ Favourites`, n: favCount() },
        { id: "all", label: `🗂️ All Apps`, n: ALL.length },
        { id: "vscode", label: `🖥️ Opened in VSCode`, n: VSCODE.length },
        { id: "llm", label: `🧠 Local LLM ${llmDot}`, n: null },
        { id: "planner", label: `📋 Planner`, n: PLANNER.boards ? PLANNER.boards.length : null },
      ];
      $("#views").innerHTML = tabs.map(t => {
        const active = t.id === activeView;
        return `<button data-view="${t.id}"
          class="px-4 py-1.5 rounded-lg text-sm font-medium ${active
            ? 'bg-indigo-600 text-white'
            : 'text-slate-300 hover:bg-slate-800'}">
          ${t.label}${t.n!==null?` <span class="opacity-60">${t.n}</span>`:''}</button>`;
      }).join("");
      $("#views").querySelectorAll("button").forEach(b =>
        b.onclick = () => {
          activeView = b.dataset.view;
          activeType = "all";
          renderViews(); renderFilters(); render();
        });
    }

    function renderFilters() {
      const base = viewApps();
      const counts = {};
      base.forEach(a => counts[a.type] = (counts[a.type]||0)+1);
      const types = ["all", ...Object.keys(counts).sort()];
      $("#filters").innerHTML = types.map(t => {
        const n = t === "all" ? base.length : counts[t];
        const active = t === activeType;
        return `<button data-type="${t}"
          class="px-3 py-1 rounded-full border ${active ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}">
          ${t} <span class="opacity-60">${n}</span></button>`;
      }).join("");
      $("#filters").querySelectorAll("button").forEach(b =>
        b.onclick = () => { activeType = b.dataset.type; renderFilters(); render(); });
    }

    function render() {
      const isGrid = (activeView === "favourites" || activeView === "all");
      $("#filters").style.display = isGrid ? "flex" : "none";
      if (metricsPoll && activeView !== "llm") { clearInterval(metricsPoll); metricsPoll = null; }
      if (activeView === "vscode") return renderVscode();
      if (activeView === "llm") return renderLlm();
      if (activeView === "planner") return renderPlanner();

      const q = $("#search").value.toLowerCase();
      const apps = viewApps().filter(a =>
        (activeType === "all" || a.type === activeType) &&
        a.name.toLowerCase().includes(q));
      let empty = `<p class="text-slate-500 col-span-full">No matching apps.</p>`;
      if (activeView === "favourites" && favCount() === 0) {
        empty = `<div class="col-span-full text-center py-16 text-slate-500">
          <p class="text-lg mb-1">⭐ No favourites yet</p>
          <p class="text-sm">Click the ☆ on any app card, or switch to
          <button id="goto-all" class="text-indigo-400 hover:underline">All Apps</button> to browse.</p>
        </div>`;
      }
      $("#grid").innerHTML = apps.map(card).join("") || empty;
      const gotoAll = $("#goto-all");
      if (gotoAll) gotoAll.onclick = () => {
        activeView = "all"; renderViews(); renderFilters(); render();
      };
      apps.forEach(a => {
        $(`#card-${cssId(a.name)}`).onclick = (e) => {
          if (e.target.closest("button")) return;
          openDrawer(a.name);
        };
        const sb = $(`#start-${cssId(a.name)}`);
        if (sb) sb.onclick = () => toggleRun(a.name, a.running);
        const fb = $(`#fav-${cssId(a.name)}`);
        if (fb) fb.onclick = () => toggleFav(a.name);
        const vb = $(`#vsc-${cssId(a.name)}`);
        if (vb) vb.onclick = () => openVscode(a.name);
      });
    }

    async function openVscode(name) {
      const r = await api(`/api/apps/${encodeURIComponent(name)}/vscode/open`, {method:"POST"});
      flash(r.message || (r.ok?"Opening…":"Failed"), r.ok);
      // Window state takes a moment to update; refresh shortly after.
      setTimeout(load, 1500);
    }

    // -------- "Opened in VSCode" view --------
    function renderVscode() {
      const q = $("#search").value.toLowerCase();
      const folders = VSCODE.filter(f =>
        f.name.toLowerCase().includes(q) || f.path.toLowerCase().includes(q));
      if (!folders.length) {
        $("#grid").innerHTML = `<div class="col-span-full text-center py-16 text-slate-500">
          <p class="text-lg mb-1">🖥️ No VS Code windows detected</p>
          <p class="text-sm">Open a project with “⧉ Edit with VSCode” from All Apps.</p></div>`;
        return;
      }
      $("#grid").innerHTML = folders.map(f => {
        const id = cssId(f.path);
        return `<div id="vf-${id}"
          class="bg-slate-800/60 hover:bg-slate-800 border border-slate-700 rounded-xl p-4 cursor-pointer transition">
          <div class="flex items-center gap-2 min-w-0">
            <span>🖥️</span><span class="font-semibold text-white truncate">${f.name}</span>
          </div>
          <p class="mt-2 text-[11px] text-slate-500 mono break-all">${f.path}</p>
          <div class="mt-3 flex items-center justify-between">
            ${f.in_projects
              ? `<span class="text-[11px] px-2 py-0.5 rounded border border-indigo-700 bg-indigo-900/40 text-indigo-300">in Projects</span>`
              : `<span class="text-[11px] text-slate-500">external folder</span>`}
            <span class="text-xs text-sky-400">Click to focus →</span>
          </div>
        </div>`;
      }).join("");
      folders.forEach(f => {
        const el = $(`#vf-${cssId(f.path)}`);
        if (el) el.onclick = () => focusVscode(f.path);
      });
    }

    async function focusVscode(path) {
      const r = await api(`/api/vscode/focus-path`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({path})});
      flash(r.message || (r.ok?"Focusing…":"Failed"), r.ok);
    }

    // -------- "Local LLM" view --------
    function renderLlm() {
      if (!modelsLoaded) {
        modelsLoaded = true;
        api("/api/llm/models").then(d => { MODELS = d.models || []; renderLlm(); });
      }
      const s = LLM || {};
      const stateColors = {running:"bg-green-600", loading:"bg-amber-600", stopped:"bg-slate-600"};
      const busy = s.state === "running" || s.state === "loading";
      const opts = MODELS.map(m =>
        `<option value="${m.path}">${m.name} · ${m.size_gb}GB</option>`).join("");
      $("#grid").innerHTML = `
      <div class="col-span-full max-w-3xl mx-auto w-full space-y-4">
        <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-5">
          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 min-w-0">
              <span class="px-3 py-1 rounded text-white text-sm ${stateColors[s.state]||'bg-slate-600'}">${s.state||'unknown'}</span>
              <div class="min-w-0">
                <div class="font-semibold text-white truncate">${s.model || 'No model loaded'}</div>
                <div class="text-xs text-slate-400 mono truncate">${s.url||''}${s.ctx?` · ctx ${s.ctx}`:''}${s.pid?` · pid ${s.pid}`:''}${s.managed?' · managed':''}</div>
              </div>
            </div>
            ${busy ? `<button id="llm-stop" class="shrink-0 px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm">■ Stop server</button>` : ''}
          </div>
          ${busy && !s.managed ? `<p class="mt-3 text-xs text-amber-400">⚠ Started outside The Manager — Stop will terminate the process on port ${s.port}.</p>` : ''}
          ${!s.server_bin ? `<p class="mt-3 text-xs text-red-400">llama-server binary not found. Set LLAMA_SERVER_BIN.</p>` : ''}
        </div>

        <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-5">
          <h3 class="text-sm font-semibold text-slate-300 mb-3">System load</h3>
          <div id="sysmon" class="text-sm text-slate-400">Sampling…</div>
        </div>

        <div class="bg-slate-800/40 border border-slate-700 rounded-xl p-5 ${busy?'opacity-50 pointer-events-none':''}">
          <h3 class="text-sm font-semibold text-slate-300 mb-3">Start a server</h3>
          <div class="space-y-3 text-sm">
            <label class="block"><span class="text-slate-400 text-xs">Model</span>
              <select id="llm-model" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-2">${opts || '<option>No models found</option>'}</select>
            </label>
            <div class="grid grid-cols-3 gap-3">
              <label class="block"><span class="text-slate-400 text-xs">Context (n_ctx)</span>
                <input id="llm-ctx" type="number" value="65536" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5 mono"/></label>
              <label class="block"><span class="text-slate-400 text-xs">GPU layers (-ngl)</span>
                <input id="llm-ngl" type="number" value="99" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5 mono"/></label>
              <label class="block"><span class="text-slate-400 text-xs">Port</span>
                <input id="llm-port" type="number" value="${s.port||8080}" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5 mono"/></label>
            </div>
            <label class="flex items-center gap-2 text-xs text-slate-300">
              <input id="llm-jinja" type="checkbox" checked/> Use --jinja (chat template)</label>
            <button id="llm-start" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium">▶ Start server</button>
          </div>
        </div>

        <div class="bg-slate-800/40 border border-slate-700 rounded-xl p-5">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-sm font-semibold text-slate-300">Server log</h3>
            <button id="llm-logbtn" class="text-xs text-indigo-400 hover:underline">Load log</button>
          </div>
          <pre id="llm-log" class="hidden bg-black/50 rounded p-3 text-xs mono text-slate-300 overflow-x-auto max-h-72"></pre>
        </div>
      </div>`;

      const stopBtn = $("#llm-stop");
      if (stopBtn) stopBtn.onclick = async () => {
        stopBtn.textContent = "Stopping…"; stopBtn.disabled = true;
        const r = await api(`/api/llm/stop`, {method:"POST"});
        flash(r.message, r.ok);
        await refreshLlm();
      };
      const startBtn = $("#llm-start");
      if (startBtn) startBtn.onclick = async () => {
        const body = {
          model_path: $("#llm-model").value,
          ctx: parseInt($("#llm-ctx").value)||65536,
          ngl: parseInt($("#llm-ngl").value)||99,
          port: parseInt($("#llm-port").value)||8080,
          jinja: $("#llm-jinja").checked,
        };
        startBtn.textContent = "Starting…"; startBtn.disabled = true;
        const r = await api(`/api/llm/start`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify(body)});
        flash(r.message, r.ok);
        if (r.ok) { showLlmLog(); watchLlm(); }
        else { startBtn.textContent = "▶ Start server"; startBtn.disabled = false; }
      };
      const logBtn = $("#llm-logbtn");
      if (logBtn) logBtn.onclick = showLlmLog;
      startMetrics();
    }

    // ---- system load (CPU / GPU / RAM) ----
    function startMetrics() {
      if (metricsPoll) clearInterval(metricsPoll);
      pollMetrics();
      metricsPoll = setInterval(pollMetrics, 3000);
    }

    async function pollMetrics() {
      if (activeView !== "llm") return;
      const snap = await api("/api/llm/metrics").catch(() => null);
      const el = $("#sysmon");
      if (!el) return;
      if (!snap || snap.warming) { el.textContent = "Sampling… (first reading takes ~3s)"; return; }
      el.innerHTML = renderSysmon(snap);
    }

    function bar(segments) {
      // segments: [{w, cls}] widths in % of total
      return `<div class="h-3 rounded bg-slate-700/70 overflow-hidden flex">${
        segments.map(s => `<div style="width:${Math.max(0,s.w)}%" class="${s.cls}"></div>`).join("")
      }</div>`;
    }

    function renderSysmon(s) {
      const gb = b => (b/1e9).toFixed(1);
      const c = s.cpu, r = s.ram, g = s.gpu;
      const cpuBar = bar([
        {w: c.llm,   cls: "bg-indigo-500"},
        {w: c.other, cls: "bg-amber-500"},
      ]);
      const ramBar = bar([
        {w: (r.llm_bytes/r.total_bytes*100),   cls: "bg-indigo-500"},
        {w: (r.other_bytes/r.total_bytes*100), cls: "bg-emerald-500"},
      ]);
      const gpuBar = g.available ? bar([{w: g.util, cls: "bg-sky-500"}]) : "";

      const rows = (s.top||[]).map(p => `
        <div class="flex items-center justify-between text-xs ${p.is_llm?'text-indigo-300 font-medium':'text-slate-400'}">
          <span class="truncate">${p.is_llm?'🧠 ':''}${p.name}</span>
          <span class="mono shrink-0 ml-2">${p.cpu_share}% cpu · ${gb(p.mem_bytes)}G</span>
        </div>`).join("");

      return `
      <div class="space-y-4">
        <div>
          <div class="flex justify-between text-xs mb-1">
            <span class="text-slate-300">CPU — ${c.busy}% busy</span>
            <span><span class="text-indigo-400">LLM ${c.llm}%</span> · <span class="text-amber-400">other ${c.other}%</span> · idle ${c.idle}%</span>
          </div>
          ${cpuBar}
          <div class="text-[11px] text-slate-500 mt-1">${s.ncpu} logical cores</div>
        </div>
        <div>
          <div class="flex justify-between text-xs mb-1">
            <span class="text-slate-300">RAM — ${gb(r.used_bytes)} / ${gb(r.total_bytes)} GB (${r.percent}%)</span>
            <span><span class="text-indigo-400">LLM ${gb(r.llm_bytes)}G</span> · <span class="text-emerald-400">other ${gb(r.other_bytes)}G</span> · free ${gb(r.free_bytes)}G</span>
          </div>
          ${ramBar}
          <div class="text-[11px] text-slate-500 mt-1">of which wired ${gb(r.wired_bytes)}G</div>
        </div>
        ${g.available ? `
        <div>
          <div class="flex justify-between text-xs mb-1">
            <span class="text-slate-300">GPU — ${g.util}% utilization</span>
            <span class="text-sky-400">active mem ~${gb(g.mem_bytes)}G</span>
          </div>
          ${gpuBar}
        </div>` : `<p class="text-xs text-slate-500">GPU stats unavailable.</p>`}
        <div>
          <div class="text-xs text-slate-300 mb-1">Top processes</div>
          <div class="space-y-1">${rows || '<span class="text-xs text-slate-500">—</span>'}</div>
        </div>
        <p class="text-[11px] text-slate-500 leading-relaxed border-t border-slate-800 pt-2">
          Memory figures are each process's physical footprint (matches Activity Monitor); for the
          GPU-offloaded model (<span class="mono">-ngl</span>) that includes its Metal/wired weights, which
          <span class="mono">ps</span>/RSS would miss. macOS doesn't expose per-process GPU utilization, so
          the GPU bar is system-wide — with the model on GPU, that activity is essentially the LLM.
        </p>
      </div>`;
    }

    async function showLlmLog() {
      const t = await fetch(`/api/llm/logs`).then(r=>r.text());
      const out = $("#llm-log");
      if (out) { out.textContent = t; out.classList.remove("hidden"); out.scrollTop = out.scrollHeight; }
    }

    async function refreshLlm() {
      LLM = await api("/api/llm/status").catch(()=>LLM);
      renderViews();
      if (activeView === "llm") renderLlm();
    }

    // Poll while a model loads until it's healthy (or stops).
    function watchLlm() {
      if (llmPoll) clearInterval(llmPoll);
      const tick = async () => {
        LLM = await api("/api/llm/status").catch(()=>LLM);
        renderViews();
        if (activeView === "llm") { renderLlm(); showLlmLog(); }
        if (LLM.state === "running" || LLM.state === "stopped") {
          clearInterval(llmPoll); llmPoll = null;
          flash(LLM.state === "running" ? "LLM server is up" : "LLM server stopped",
                LLM.state === "running");
        }
      };
      tick();
      llmPoll = setInterval(tick, 2000);
    }

    // -------- "Planner" view (kanban) --------
    const COLS = [
      {id:"todo", label:"To Do"},
      {id:"doing", label:"In Progress"},
      {id:"done", label:"Done"},
    ];
    const PRI_COLORS = {high:"bg-red-500", med:"bg-amber-500", low:"bg-slate-500"};

    // --- drag-and-drop (between columns AND vertical reorder within one) ---
    let dragTaskId = null;
    let dragMarker = null;
    function _marker() {
      if (!dragMarker) {
        dragMarker = document.createElement("div");
        dragMarker.className = "h-1 bg-indigo-400 rounded";
      }
      return dragMarker;
    }
    function _removeMarker() {
      if (dragMarker && dragMarker.parentNode) dragMarker.parentNode.removeChild(dragMarker);
    }
    function _colCards(col) {
      return Array.from(col.children).filter(c =>
        c.id && c.id.startsWith("task-") && c.id !== "task-" + dragTaskId);
    }
    function _dropIndex(col, y) {
      const cards = _colCards(col);
      for (let i = 0; i < cards.length; i++) {
        const r = cards[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) return i;
      }
      return cards.length;
    }
    function _placeMarker(col, y) {
      const cards = _colCards(col);
      const idx = _dropIndex(col, y);
      const mk = _marker();
      if (idx >= cards.length) col.appendChild(mk);
      else col.insertBefore(mk, cards[idx]);
    }

    function activeBoard() {
      return PLANNER.boards.find(b => b.id === activeBoardId) || PLANNER.boards[0] || null;
    }

    function renderPlanner() {
      const boards = PLANNER.boards;
      if (!boards.length) {
        $("#grid").innerHTML = `<div class="col-span-full">
          <button id="new-board" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm mb-4">+ New board</button>
          <div class="text-center py-16 text-slate-500">
            <p class="text-lg mb-1">📋 No boards yet</p>
            <p class="text-sm">Create a board to start planning a project.</p>
          </div></div>`;
        $("#new-board").onclick = newBoard;
        return;
      }
      const board = activeBoard();
      const tabs = boards.map(b => `<button data-board="${b.id}"
          class="px-3 py-1.5 rounded-lg text-sm ${b.id===board.id?'bg-slate-700 text-white':'text-slate-300 hover:bg-slate-800'}">
          ${escapeHtml(b.name)} <span class="opacity-50">${b.tasks.length}</span></button>`).join("");
      const appChip = board.app
        ? `<span class="text-xs text-slate-400">↳ <button id="board-app" class="text-indigo-400 hover:underline">${escapeHtml(board.app)}</button></span>` : "";

      const columns = COLS.map(c => {
        const tasks = board.tasks.filter(t => t.status===c.id).sort((a,b)=>a.order-b.order);
        const cards = tasks.map(taskCard).join("") ||
          `<p class="text-xs text-slate-600 text-center py-6 pointer-events-none">drop here</p>`;
        return `<div class="flex-1 min-w-[240px]">
          <h3 class="text-sm font-semibold text-slate-300 mb-2 px-1">${c.label} <span class="opacity-50">${tasks.length}</span></h3>
          <div class="kcol bg-slate-900/40 border border-slate-800 rounded-xl p-2 min-h-[120px] space-y-2" data-col="${c.id}">${cards}</div>
          <input data-add="${c.id}" placeholder="+ Add task, press Enter"
            class="mt-2 w-full bg-slate-800/60 border border-slate-700 rounded px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-500"/>
        </div>`;
      }).join("");

      $("#grid").innerHTML = `<div class="col-span-full">
        <div class="flex items-center gap-2 mb-4 flex-wrap">
          ${tabs}
          <button id="new-board" class="px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800 text-sm">+ Board</button>
        </div>
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-3"><h2 class="text-lg font-bold text-white">${escapeHtml(board.name)}</h2>${appChip}</div>
          <div class="flex gap-3">
            <button id="rename-board" class="text-xs text-slate-400 hover:text-white">✎ Rename</button>
            <button id="link-board" class="text-xs text-slate-400 hover:text-white">🔗 Link app</button>
            <button id="del-board" class="text-xs text-red-400 hover:text-red-300">🗑 Delete board</button>
          </div>
        </div>
        <div class="flex gap-3 overflow-x-auto pb-2">${columns}</div>
      </div>`;

      $$("[data-board]").forEach(b => b.onclick = () => { activeBoardId = b.dataset.board; renderPlanner(); });
      $("#new-board").onclick = newBoard;
      $("#rename-board").onclick = () => renameBoard(board);
      $("#link-board").onclick = () => linkBoard(board);
      $("#del-board").onclick = () => deleteBoard(board);
      const bapp = $("#board-app"); if (bapp) bapp.onclick = () => openDrawer(board.app);

      $$("[data-add]").forEach(inp => inp.onkeydown = async (e) => {
        if (e.key === "Enter" && inp.value.trim()) {
          const v = inp.value.trim(); inp.value = "";
          await addTask(board.id, v, inp.dataset.add);
        }
      });

      board.tasks.forEach(t => {
        const el = $(`#task-${t.id}`);
        if (!el) return;
        el.onclick = () => { if (!el._dragging) openTaskEditor(board.id, t.id); };
        el.ondragstart = (e) => {
          el._dragging = true; dragTaskId = t.id;
          e.dataTransfer.setData("text/plain", t.id);
          e.dataTransfer.effectAllowed = "move";
          setTimeout(() => el.classList.add("opacity-40"), 0);
        };
        el.ondragend = () => {
          setTimeout(() => el._dragging = false, 60);
          el.classList.remove("opacity-40");
          dragTaskId = null; _removeMarker();
        };
      });
      $$(".kcol").forEach(col => {
        col.ondragover = (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          col.classList.add("ring-1","ring-indigo-500/60");
          _placeMarker(col, e.clientY);
        };
        col.ondragleave = (e) => {
          if (!col.contains(e.relatedTarget)) {
            col.classList.remove("ring-1","ring-indigo-500/60");
            if (dragMarker && dragMarker.parentNode === col) _removeMarker();
          }
        };
        col.ondrop = async (e) => {
          e.preventDefault();
          col.classList.remove("ring-1","ring-indigo-500/60");
          const taskId = e.dataTransfer.getData("text/plain") || dragTaskId;
          const idx = _dropIndex(col, e.clientY);
          _removeMarker();
          if (taskId) await moveTaskTo(board.id, taskId, col.dataset.col, idx);
        };
      });
    }

    async function moveTaskTo(boardId, taskId, status, index) {
      await api(`/api/planner/boards/${boardId}/tasks/${taskId}/move`, {method:"PUT",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify({status, index})});
      await reloadPlanner(); renderPlanner();
    }

    function taskCard(t) {
      const due = t.due ? `<span class="text-[11px] text-slate-400">📅 ${t.due}</span>` : "";
      const appc = t.app ? `<span class="text-[11px] text-indigo-300">↳ ${escapeHtml(t.app)}</span>` : "";
      const notes = t.notes ? `<span class="text-[11px] text-slate-500">📝</span>` : "";
      return `<div id="task-${t.id}" draggable="true"
        class="bg-slate-800 border border-slate-700 rounded-lg p-3 cursor-grab active:cursor-grabbing hover:border-slate-500">
        <div class="flex items-start gap-2">
          <span class="mt-1.5 w-2 h-2 rounded-full shrink-0 ${PRI_COLORS[t.priority]||'bg-slate-500'}"></span>
          <span class="text-sm text-slate-100 ${t.status==='done'?'line-through opacity-60':''}">${escapeHtml(t.title)}</span>
        </div>
        ${(due||appc||notes)?`<div class="mt-2 flex items-center gap-2 flex-wrap pl-4">${due}${appc}${notes}</div>`:""}
      </div>`;
    }

    async function reloadPlanner() {
      const p = await api("/api/planner").catch(()=>PLANNER);
      PLANNER = p && p.boards ? p : {boards:[]};
      renderViews();
    }

    async function newBoard() {
      const name = prompt("New board name:");
      if (!name) return;
      const r = await api("/api/planner/boards", {method:"POST",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify({name})});
      await reloadPlanner();
      if (r.board) activeBoardId = r.board.id;
      renderPlanner();
    }
    async function renameBoard(board) {
      const name = prompt("Rename board:", board.name);
      if (!name) return;
      await api(`/api/planner/boards/${board.id}`, {method:"PUT",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify({name})});
      await reloadPlanner(); renderPlanner();
    }
    async function linkBoard(board) {
      const name = prompt("Link this board to which app? (exact name, blank to unlink)", board.app||"");
      if (name === null) return;
      await api(`/api/planner/boards/${board.id}`, {method:"PUT",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify({app: name.trim()||null})});
      await reloadPlanner(); renderPlanner();
    }
    async function deleteBoard(board) {
      if (!confirm(`Delete board "${board.name}" and all its tasks?`)) return;
      await api(`/api/planner/boards/${board.id}`, {method:"DELETE"});
      if (activeBoardId === board.id) activeBoardId = null;
      await reloadPlanner();
      if (!activeBoardId && PLANNER.boards.length) activeBoardId = PLANNER.boards[0].id;
      renderPlanner();
    }
    async function addTask(boardId, title, status) {
      await api(`/api/planner/boards/${boardId}/tasks`, {method:"POST",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify({title, status})});
      await reloadPlanner(); renderPlanner();
    }
    async function moveTask(boardId, taskId, status) {
      await api(`/api/planner/boards/${boardId}/tasks/${taskId}`, {method:"PUT",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify({status})});
      await reloadPlanner(); renderPlanner();
    }

    function openTaskEditor(boardId, taskId) {
      const board = PLANNER.boards.find(b=>b.id===boardId);
      const t = board && board.tasks.find(x=>x.id===taskId);
      if (!t) return;
      const appOpts = ['<option value="">— none —</option>']
        .concat(ALL.map(a=>`<option value="${a.name}" ${t.app===a.name?'selected':''}>${a.name}</option>`)).join("");
      const priOpts = ["low","med","high"].map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${p}</option>`).join("");
      const statOpts = COLS.map(c=>`<option value="${c.id}" ${t.status===c.id?'selected':''}>${c.label}</option>`).join("");
      $("#task-modal-content").innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-white">Edit task</h3>
          <button id="tm-close" class="text-slate-400 hover:text-white text-2xl leading-none">×</button>
        </div>
        <div class="space-y-3 text-sm">
          <input id="tm-title" value="${escapeHtml(t.title).replace(/"/g,'&quot;')}" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2"/>
          <textarea id="tm-notes" rows="4" placeholder="Notes…" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2">${escapeHtml(t.notes||"")}</textarea>
          <div class="grid grid-cols-3 gap-3">
            <label class="block"><span class="text-xs text-slate-400">Status</span>
              <select id="tm-status" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5">${statOpts}</select></label>
            <label class="block"><span class="text-xs text-slate-400">Priority</span>
              <select id="tm-pri" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5">${priOpts}</select></label>
            <label class="block"><span class="text-xs text-slate-400">Due</span>
              <input id="tm-due" type="date" value="${t.due||''}" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5"/></label>
          </div>
          <label class="block"><span class="text-xs text-slate-400">Linked app</span>
            <select id="tm-app" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5">${appOpts}</select></label>
          <div class="flex items-center justify-between pt-2">
            <button id="tm-del" class="text-xs text-red-400 hover:text-red-300">🗑 Delete task</button>
            <div class="flex gap-2">
              <button id="tm-cancel" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-sm">Cancel</button>
              <button id="tm-save" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm">Save</button>
            </div>
          </div>
        </div>`;
      $("#task-modal").classList.remove("hidden");
      const close = () => $("#task-modal").classList.add("hidden");
      $("#tm-close").onclick = close;
      $("#tm-cancel").onclick = close;
      $("#task-modal-bg").onclick = close;
      $("#tm-save").onclick = async () => {
        const body = {
          title: $("#tm-title").value.trim() || "Untitled",
          notes: $("#tm-notes").value,
          status: $("#tm-status").value,
          priority: $("#tm-pri").value,
          due: $("#tm-due").value || null,
          app: $("#tm-app").value || null,
        };
        await api(`/api/planner/boards/${boardId}/tasks/${taskId}`, {method:"PUT",
          headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
        close(); await reloadPlanner(); renderPlanner();
      };
      $("#tm-del").onclick = async () => {
        if (!confirm("Delete this task?")) return;
        await api(`/api/planner/boards/${boardId}/tasks/${taskId}`, {method:"DELETE"});
        close(); await reloadPlanner(); renderPlanner();
      };
    }

    async function toggleFav(name) {
      const r = await api(`/api/apps/${encodeURIComponent(name)}/favourite`, {method:"POST"});
      const app = ALL.find(a => a.name === name);
      if (app) app.favourite = r.favourite;
      renderViews(); renderFilters(); render();
    }

    const cssId = s => s.replace(/[^a-zA-Z0-9]/g, "_");

    function card(a) {
      const dot = a.running
        ? '<span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>'
        : '<span class="w-2 h-2 rounded-full bg-slate-600"></span>';
      const btn = a.has_start_command
        ? `<button id="start-${cssId(a.name)}"
             class="text-xs px-3 py-1.5 rounded-md font-medium ${a.running
               ? 'bg-red-600 hover:bg-red-500 text-white'
               : 'bg-indigo-600 hover:bg-indigo-500 text-white'}">
             ${a.running ? '■ Stop' : '▶ Start'}</button>`
        : `<span class="text-xs text-slate-500">no run cmd</span>`;
      const star = `<button id="fav-${cssId(a.name)}" title="${a.favourite?'Unfavourite':'Favourite'}"
          class="text-lg leading-none ${a.favourite?'text-amber-400':'text-slate-600 hover:text-amber-300'}">
          ${a.favourite?'★':'☆'}</button>`;
      return `
      <div id="card-${cssId(a.name)}"
        class="bg-slate-800/60 hover:bg-slate-800 border border-slate-700 rounded-xl p-4 cursor-pointer transition">
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            ${star}
            ${dot}
            <span class="font-semibold text-white truncate">${a.name}</span>
          </div>
          ${btn}
        </div>
        <div class="mt-3 flex items-center gap-2 flex-wrap">
          <span class="text-[11px] px-2 py-0.5 rounded border ${typeClass(a.type)}">${a.type}</span>
          ${a.port ? `<span class="text-[11px] text-slate-400 mono">:${a.port}</span>` : ""}
        </div>
        <button id="vsc-${cssId(a.name)}"
          class="mt-3 w-full text-xs px-3 py-1.5 rounded-md border ${a.vscode_open
            ? 'bg-sky-900/40 border-sky-700 text-sky-300'
            : 'bg-slate-700/50 border-slate-600 text-slate-200 hover:bg-slate-700'}">
          ${a.vscode_open ? '✓ Opened in VSCode' : '⧉ Edit with VSCode'}</button>
      </div>`;
    }

    async function toggleRun(name, running) {
      const action = running ? "stop" : "start";
      const r = await api(`/api/apps/${encodeURIComponent(name)}/${action}`, {method:"POST"});
      flash(r.message || (r.ok ? "OK" : "Failed"), r.ok);
      await load();
      if (!$("#drawer").classList.contains("hidden")) openDrawer(name);
    }

    function flash(msg, ok=true) {
      const el = document.createElement("div");
      el.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-lg text-sm shadow-lg ${ok?'bg-green-700':'bg-red-700'} text-white`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // -------- Drawer --------
    async function openDrawer(name) {
      if (setupPoll) { clearInterval(setupPoll); setupPoll = null; }
      $("#drawer").classList.remove("hidden");
      $("#drawer-content").innerHTML = `<p class="text-slate-400">Loading ${name}…</p>`;
      const d = await api(`/api/apps/${encodeURIComponent(name)}`);
      $("#drawer-content").innerHTML = drawerHtml(d);
      wireDrawer(d);
    }

    function closeDrawer() {
      if (setupPoll) { clearInterval(setupPoll); setupPoll = null; }
      $("#drawer").classList.add("hidden");
    }

    // Poll setup logs + status until the job finishes.
    function watchSetup(name) {
      const enc = encodeURIComponent(name);
      const out = $("#setup-out");
      const btn = $("#run-setup");
      if (!out) return;
      out.classList.remove("hidden");
      if (setupPoll) clearInterval(setupPoll);
      const tick = async () => {
        const [logs, st] = await Promise.all([
          fetch(`/api/apps/${enc}/setup/logs`).then(r => r.text()),
          api(`/api/apps/${enc}/setup/status`),
        ]);
        out.textContent = logs;
        out.scrollTop = out.scrollHeight;
        const s = st.setup;
        if (s && !s.running) {
          clearInterval(setupPoll); setupPoll = null;
          const ok = s.exit_code === 0;
          if (btn) { btn.disabled = false; btn.textContent = "⚙ Run setup / install"; }
          flash(ok ? `Setup finished (exit 0)` : `Setup failed (exit ${s.exit_code})`, ok);
        }
      };
      tick();
      setupPoll = setInterval(tick, 1500);
    }

    function healthBadge(h) {
      const map = {
        healthy: "bg-green-600", running: "bg-green-700", starting: "bg-amber-600",
        crashed: "bg-red-600", stopped: "bg-slate-600",
      };
      return `<span class="px-2 py-0.5 rounded text-xs text-white ${map[h.state]||'bg-slate-600'}">${h.state}</span>`;
    }

    function drawerHtml(d) {
      const c = d.config, g = d.git, h = d.health, p = d.process;
      const gitBox = g.is_repo ? `
        <div class="grid grid-cols-2 gap-y-1 text-sm">
          <span class="text-slate-400">Branch</span><span class="mono">${g.branch||"?"}</span>
          <span class="text-slate-400">Status</span><span>${g.dirty?`<span class="text-amber-400">${g.changed_count} changed</span>`:'<span class="text-green-400">clean</span>'}</span>
          <span class="text-slate-400">Ahead / Behind</span><span class="mono">${g.ahead} / ${g.behind}</span>
          <span class="text-slate-400">Last commit</span><span class="mono text-xs">${(g.last_commit||"").slice(0,80)}</span>
        </div>` : `<p class="text-slate-500 text-sm">Not a git repository.</p>`;

      return `
      <div class="flex items-start justify-between mb-4">
        <div>
          <h2 class="text-xl font-bold text-white">${d.name}</h2>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-[11px] px-2 py-0.5 rounded border ${typeClass(c.type)}">${c.type}</span>
            <span class="text-xs text-slate-400">${c.language||""}</span>
            ${healthBadge(h)}
          </div>
        </div>
        <button id="close-drawer" class="text-slate-400 hover:text-white text-2xl leading-none">×</button>
      </div>

      <p class="text-xs text-slate-500 mono mb-4 break-all">${d.path}</p>

      <div class="flex gap-2 mb-5">
        <button id="d-run" class="px-4 py-2 rounded-lg font-medium ${p&&p.running?'bg-red-600 hover:bg-red-500':'bg-indigo-600 hover:bg-indigo-500'} text-white ${c.start_command?'':'opacity-40 cursor-not-allowed'}">
          ${p&&p.running?'■ Stop':'▶ Start'}</button>
        <button id="d-update" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white">⟳ Update (git pull)</button>
        <button id="d-refresh" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white">↻</button>
      </div>

      ${section("📝 Description", `<p class="text-sm text-slate-300 leading-relaxed">${escapeHtml(d.description)}</p>`)}

      ${section("🚀 Run config", `
        <div class="grid grid-cols-[120px_1fr] gap-y-1 text-sm items-center">
          <span class="text-slate-400">Start cmd</span>
          <span class="mono text-xs ${c.start_command?'text-slate-200':'text-slate-500'}">${c.start_command||"— none detected —"}</span>
          <span class="text-slate-400">Port</span><span class="mono">${c.port||"—"}</span>
          <span class="text-slate-400">Setup</span><span class="mono text-xs text-slate-400">${c.setup_command||"—"}</span>
          ${p?`<span class="text-slate-400">PID</span><span class="mono">${p.pid} ${p.running?`· up ${p.uptime_seconds}s`:`· exit ${p.exit_code}`}</span>`:""}
        </div>
        <button id="edit-cfg" class="mt-2 text-xs text-indigo-400 hover:underline">✎ Edit start command / port</button>
        <div id="cfg-edit" class="hidden mt-2 space-y-2">
          <input id="cfg-start" value="${(c.start_command||'').replace(/"/g,'&quot;')}" placeholder="start command"
            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs mono"/>
          <input id="cfg-port" value="${c.port||''}" placeholder="port"
            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs mono"/>
          <button id="cfg-save" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded">Save</button>
        </div>
        ${c.setup_command ? `
        <div class="mt-3 pt-3 border-t border-slate-700">
          <button id="run-setup" class="text-xs px-3 py-1.5 rounded-md bg-amber-700 hover:bg-amber-600 text-white font-medium">
            ⚙ Run setup / install</button>
          <span class="ml-2 text-[11px] text-slate-500 mono">${c.setup_command}</span>
          <pre id="setup-out" class="hidden mt-2 bg-black/50 rounded p-3 text-xs mono text-slate-300 overflow-x-auto max-h-72"></pre>
        </div>` : ""}`)}

      ${section("🌿 Git", gitBox + (g.is_repo?'<div id="git-out" class="mt-2"></div>':''))}

      ${section("❤️ Health", `
        <div class="text-sm grid grid-cols-2 gap-y-1">
          <span class="text-slate-400">State</span><span>${healthBadge(h)}</span>
          <span class="text-slate-400">Port</span><span class="mono">${h.port?`${h.port} (${h.port_status})`:'—'}</span>
          <span class="text-slate-400">Uptime</span><span class="mono">${h.uptime_seconds}s</span>
        </div>`)}

      ${section("📜 Logs", `<button id="d-logs" class="text-xs text-indigo-400 hover:underline">Load latest logs</button>
        <pre id="logs-out" class="hidden mt-2 bg-black/50 rounded p-3 text-xs mono text-slate-300 overflow-x-auto max-h-72"></pre>`)}

      ${section("💬 Chat", `<p class="text-xs text-slate-500">AI chat about this app is a planned next pass (reads README + git + code, answers via Claude API).</p>`)}
      `;
    }

    function section(title, body) {
      return `<div class="mb-4 bg-slate-800/40 border border-slate-700 rounded-xl p-4">
        <h3 class="text-sm font-semibold text-slate-300 mb-2">${title}</h3>${body}</div>`;
    }
    function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

    function wireDrawer(d) {
      const name = d.name, enc = encodeURIComponent(name);
      $("#close-drawer").onclick = closeDrawer;
      $("#d-refresh").onclick = () => openDrawer(name);
      const runBtn = $("#d-run");
      if (d.config.start_command) runBtn.onclick = async () => {
        await toggleRun(name, d.process && d.process.running);
      };
      $("#d-update").onclick = async () => {
        $("#d-update").textContent = "⟳ Pulling…";
        const r = await api(`/api/apps/${enc}/update`, {method:"POST"});
        flash(r.output ? r.output.split("\n")[0] : (r.ok?"Updated":"Failed"), r.ok);
        openDrawer(name);
      };
      const editBtn = $("#edit-cfg");
      if (editBtn) editBtn.onclick = () => $("#cfg-edit").classList.toggle("hidden");
      const saveBtn = $("#cfg-save");
      if (saveBtn) saveBtn.onclick = async () => {
        const body = {
          start_command: $("#cfg-start").value || null,
          port: $("#cfg-port").value ? parseInt($("#cfg-port").value) : null,
        };
        await api(`/api/apps/${enc}/config`, {
          method:"PUT", headers:{"Content-Type":"application/json"},
          body: JSON.stringify(body)});
        flash("Saved config");
        openDrawer(name);
      };
      $("#d-logs").onclick = async () => {
        const t = await fetch(`/api/apps/${enc}/logs`).then(r=>r.text());
        const out = $("#logs-out");
        out.textContent = t; out.classList.remove("hidden");
      };
      const setupBtn = $("#run-setup");
      if (setupBtn) {
        setupBtn.onclick = async () => {
          setupBtn.disabled = true;
          setupBtn.textContent = "⚙ Running…";
          const r = await api(`/api/apps/${enc}/setup`, {method:"POST"});
          if (!r.ok) {
            flash(r.message || "Failed to start setup", false);
            setupBtn.disabled = false;
            setupBtn.textContent = "⚙ Run setup / install";
            return;
          }
          watchSetup(name);
        };
        // If a setup is already in flight (e.g. drawer reopened), resume.
        api(`/api/apps/${enc}/setup/status`).then(st => {
          if (st.setup && st.setup.running) {
            setupBtn.disabled = true;
            setupBtn.textContent = "⚙ Running…";
            watchSetup(name);
          }
        });
      }
    }

    // events
    $("#refresh").onclick = load;
    $("#search").oninput = render;
    $("#drawer-bg").onclick = closeDrawer;
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

    load();
    setInterval(() => {
      // Don't auto-reload while a drawer/modal is open or on the LLM/Planner
      // views (it would reset inputs / drag state); those self-refresh.
      const busy = !$("#drawer").classList.contains("hidden")
        || !$("#task-modal").classList.contains("hidden")
        || activeView === "llm" || activeView === "planner";
      if (!busy) load();
    }, 8000);
  </script>
</body>
</html>
