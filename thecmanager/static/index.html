<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

  <link rel="stylesheet" href="/static/fonts.css" />
  <link rel="stylesheet" href="/static/tokens.css" />

  <script src="/static/vendor/marked.min.js"></script>
  <!-- Theme lives in tools/tailwind.config.js and is compiled into
       /static/app.css. Regenerate with: cd tools && npm run css -->
  <style>
    body { background: var(--bg); color: var(--text); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    /* card soft depth on bordered cards/panels */
    [class~="rounded-xl"][class~="border"] { box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.30); }
    [class~="rounded-2xl"][class~="border"] { box-shadow: 0 8px 30px rgba(0,0,0,.45); }
    /* Markdown preview (no Tailwind typography plugin on the CDN build) */
    #site-preview h1 { font-size: 1.45em; font-weight: 700; margin: .5em 0; }
    #site-preview h2 { font-size: 1.2em; font-weight: 700; margin: .5em 0; }
    #site-preview h3 { font-size: 1.05em; font-weight: 600; margin: .4em 0; }
    #site-preview p, #site-preview ul, #site-preview ol { margin: .5em 0; }
    #site-preview ul { list-style: disc; padding-left: 1.2em; }
    #site-preview ol { list-style: decimal; padding-left: 1.2em; }
    #site-preview a { color: #9b82f5; text-decoration: underline; }
    #site-preview code { background: rgba(255,255,255,.08); padding: 1px 4px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: .9em; }
    #site-preview pre { background: rgba(0,0,0,.4); padding: .6em; border-radius: 8px; overflow:auto; }
    #site-preview img { max-width: 100%; border-radius: 8px; }
    #site-preview blockquote { border-left: 3px solid #2e2a4d; padding-left: .8em; color: #9a96b3; }
  </style>
</head>
<script>
    // Inline and synchronous on purpose: set the theme before first paint,
    // otherwise a light-theme user gets a dark flash on every load.
    (function () {
      try {
        var t = localStorage.getItem("gsoTheme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <body class="text-slate-200">
    <a href="#grid" class="skip-link">Skip to app list</a>
    <!-- Screen readers announce changes here: app started/stopped, errors. -->
    <div id="a11y-live" class="sr-only-live" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="conn-banner" class="conn-banner" data-state="up" role="alert" aria-live="assertive"></div>
    <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div class="gso-shell">
    <!-- ============ Sidebar ============ -->
    <aside class="gso-side" aria-label="Main navigation">
      <div class="gso-side-full" style="display:contents">
        <div class="gso-logo-row">
          <img src="/static/favicon.svg" alt="" class="gso-logo" />
          <span class="gso-wordmark">GSO-1</span>
          <button id="side-collapse" class="gso-collapse" aria-label="Collapse sidebar"
            title="Collapse sidebar">&lsaquo;</button>
        </div>
        <nav id="side-nav" aria-label="Views"></nav>
        <div class="gso-side-foot">
          <div class="gso-user">
            <span class="gso-avatar" aria-hidden="true">RS</span>
            <span>
              <span class="gso-user-name" style="display:block">Rafsun</span>
              <span class="gso-user-sub">Owner &middot; full access</span>
            </span>
          </div>
        </div>
      </div>
      <div class="gso-side-rail">
        <button id="rail-expand" class="gso-rail-btn" aria-label="Expand sidebar" title="Expand sidebar"
          style="width:28px;height:28px;padding:0">
          <img src="/static/favicon.svg" alt="" style="width:22px;height:22px;border-radius:6px" />
        </button>
        <div id="rail-nav" style="display:flex;flex-direction:column;gap:7px;align-items:center"></div>
        <span class="gso-avatar" aria-hidden="true" style="margin-top:auto">RS</span>
      </div>
    </aside>

    <!-- ============ Content column ============ -->
    <div class="gso-content">
      <header class="gso-head">
        <div class="gso-title-block">
          <div class="gso-title" id="view-title">Library</div>
          <div class="gso-subtitle" id="subtitle">Loading&hellip;</div>
        </div>
        <button id="cmdk" class="gso-cmdk" title="Jump to anything — Cmd+K"
          aria-label="Jump to anything">
          <span aria-hidden="true">&#9906;</span><kbd>&#8984;K</kbd>
        </button>
        <div class="gso-head-right">
          <button id="theme-toggle" class="gso-theme-toggle" aria-label="Switch colour theme"
            title="Switch between dark and light">DARK</button>
          <button id="refresh" class="gso-icon-btn" aria-label="Rescan projects" title="Rescan">&#10227;</button>
          <button id="dock-details" class="gso-dock-btn" aria-pressed="false"
            aria-controls="drawer" title="Show repo details">Details</button>
          <button id="ops-open" class="gso-dock-btn" aria-pressed="false" aria-controls="ops-panel"

      <div class="gso-body">

          class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm w-64 focus:outline-none focus:border-indigo-500" />

            class="flex flex-wrap gap-2 text-xs"></div>

        <!-- App grid -->
        <main id="grid" tabindex="-1" aria-label="Applications"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"

    </div>

    <aside id="ops-panel" aria-label="Ops Room" role="complementary" class="gso-dock" data-open="0">
  <div class="gso-dock-head">

    <div class="flex items-center gap-2">
      <button id="ops-cancel" class="hidden text-[11px] bg-rose-700 hover:bg-rose-600 rounded px-2 py-1">Stop</button>
      <button id="ops-clear" class="text-[11px] bg-slate-800 hover:bg-slate-700 rounded px-2 py-1">Clear</button>

  <div id="ops-log" class="gso-dock-body space-y-2 text-[13px] leading-relaxed">
    <div class="text-slate-500 text-xs">
      Ask about your projects &mdash; git state, apps, logs &mdash; or have it change its own code.
      Runs on the local model; a reply takes ~30s.
    </div>
  </div>
  <div class="gso-dock-foot">
    <textarea id="ops-input" rows="3" placeholder="Ask Ops Room&hellip;   (Cmd+Enter to send)"
      class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm resize-none
             focus:outline-none focus:border-indigo-500"></textarea>
    <div class="flex justify-between items-center mt-2">
      <span id="ops-hint" class="text-[11px] text-slate-600"></span>
      <button id="ops-send" class="bg-indigo-600 hover:bg-indigo-500 rounded-lg px-3 py-1.5 text-sm">Send</button>
    </div>
  </div>
</aside>

  <!-- Task editor modal -->
  <div id="task-modal" class="fixed inset-0 z-[55] hidden" role="dialog" aria-modal="true" aria-label="Edit task">
    <div id="task-modal-bg" class="absolute inset-0 bg-black/60"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-slate-900 border border-slate-700 rounded-xl shadow-2xl p-6">
      <div id="task-modal-content"></div>
    </div>
  </div>

  <!-- Detail drawer -->
  <div id="drawer" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-label="App details">
    <div id="drawer-bg" class="absolute inset-0 bg-black/60"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-2xl bg-slate-900 border-l border-slate-700 shadow-2xl overflow-y-auto">
      <div id="drawer-content" class="p-6"></div>
    </div>
  </div>

  <script>

    // ---- accessibility helpers -------------------------------------------
    let _announceTimer = null;
    function announce(msg) {
      const el = document.getElementById("a11y-live");
      if (!el) return;
      // Clearing first makes screen readers re-read an identical message.
      el.textContent = "";
      clearTimeout(_announceTimer);
      _announceTimer = setTimeout(() => { el.textContent = msg; }, 60);
    }

    // Focus management for dialogs: remember what was focused, move focus in,
    // trap Tab inside, and restore on close. Without this a keyboard user tabs
    // straight out of an open dialog into the page behind it.
    let _lastFocus = null;
    function trapFocus(container) {
      _lastFocus = document.activeElement;
      const sel = 'a[href], button:not([disabled]), input, textarea, select, [tabindex]:not([tabindex="-1"])';
      const focusables = () => Array.from(container.querySelectorAll(sel)).filter(e => e.offsetParent !== null);
      const first = focusables()[0];
      if (first) {
        first.focus();
      } else {
        // Content is still loading. Park focus on the dialog itself so the
        // user is inside it, and let focusFirstIn() refine that later.
        container.setAttribute("tabindex", "-1");
        container.focus();
      }
      container._trap = (e) => {
        if (e.key !== "Tab") return;
        const f = focusables();
        if (!f.length) return;
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      };
      container.addEventListener("keydown", container._trap);
    }
    /** Move focus to the first focusable child once async content has landed. */
    function focusFirstIn(container) {
      if (!container || container.classList.contains("hidden")) return;
      const sel = 'a[href], button:not([disabled]), input, textarea, select, [tabindex]:not([tabindex="-1"])';
      const first = Array.from(container.querySelectorAll(sel)).find(e => e.offsetParent !== null);
      if (first && !container.contains(document.activeElement)) first.focus();
      else if (first && document.activeElement === container) first.focus();
    }

    function releaseFocus(container) {
      if (container && container._trap) container.removeEventListener("keydown", container._trap);
      if (_lastFocus && document.contains(_lastFocus)) _lastFocus.focus();
      _lastFocus = null;
    }

    const $ = (s, r=document) => r.querySelector(s);
    const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
    /**
     * Hardened fetch wrapper.
     *
     * The previous one-liner did `fetch(p).then(r => r.json())` — no status
     * check, no timeout. A 500 returning an HTML error page threw an opaque
     * JSON parse error, and a 404 returning {"detail": ...} was handed to
     * callers as if it were success data.
     */
    class ApiError extends Error {
      constructor(message, status, path) {
        super(message);
        this.name = "ApiError";
        this.status = status;
        this.path = path;
      }
    }

    async function api(p, opt) {
      const o = Object.assign({}, opt);
      // Without a timeout a hung backend leaves the UI waiting forever.
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), o.timeoutMs || 120000);
      o.signal = ctl.signal;
      let r;
      try {
        r = await fetch(p, o);
      } catch (e) {
        clearTimeout(timer);
        setConnection(false);
        throw new ApiError(
          e.name === "AbortError" ? "Request timed out" : "Cannot reach GSO-1",
          0, p);
      }
      clearTimeout(timer);
      setConnection(true);

      const body = await r.text();
      let data = null;
      try { data = body ? JSON.parse(body) : null; } catch { /* not JSON */ }

      if (!r.ok) {
        const detail = (data && (data.detail || data.error || data.message))
          || (body ? body.slice(0, 160) : `HTTP ${r.status}`);
        throw new ApiError(String(detail), r.status, p);
      }
      return data;
    }

    // ---- connection state -------------------------------------------------
    let _connOk = true;
    function setConnection(ok) {
      if (ok === _connOk) return;
      _connOk = ok;
      const b = document.getElementById("conn-banner");
      if (!b) return;
      if (!ok) {
        b.textContent = "⚠ Lost connection to GSO-1 — retrying…";
        b.dataset.state = "down";
        announce("Lost connection to GSO-1");
      } else {
        b.textContent = "✓ Reconnected";
        b.dataset.state = "recovered";
        announce("Reconnected to GSO-1");
        setTimeout(() => { if (_connOk) b.dataset.state = "up"; }, 2500);
      }
    }

    // ---- toasts -----------------------------------------------------------
    function toast(message, kind) {
      const host = document.getElementById("toasts");
      if (!host) return;
      const el = document.createElement("div");
      el.className = "toast";
      el.dataset.kind = kind || "info";
      el.setAttribute("role", kind === "error" ? "alert" : "status");
      el.innerHTML = `<span aria-hidden="true">${kind === "error" ? "⚠" : kind === "success" ? "✓" : "ℹ"}</span>
        <span class="flex-1"></span>
        <button aria-label="Dismiss" class="text-slate-400 hover:text-slate-200">✕</button>`;
      el.querySelector(".flex-1").textContent = message;
      el.querySelector("button").onclick = () => el.remove();
      host.appendChild(el);
      if (kind !== "error") setTimeout(() => el.remove(), 5000);
      else setTimeout(() => el.remove(), 12000);
      announce(message);
    }

    /** Wrap an action so a failure is visible instead of swallowed. */
    async function guard(label, fn) {
      try { return await fn(); }
      catch (e) {
        toast(`${label}: ${e.message || e}`, "error");
        return null;
      }
    }
    let ALL = [];
    let ROOTS = [];                 // project root labels (one tab each)
    let CHAT = null;                // chat state (Claude Code on local LLM)
    let chatBusy = false;           // (legacy) immediate-send flag
    let chatPolling = false;        // polling while a turn streams
    let SITE = null;                // site CMS overview (collections + status)
    let siteColl = null;            // selected collection id
    let siteItems = [];             // items in the selected collection
    let siteFile = null;            // selected item filename
    let siteItem = null;            // loaded item {frontmatter, body}
    let siteBusy = false;
    let VSCODE = [];                // folders open in VS Code
    let LLM = {};                   // llama.cpp server status
    let MODELS = [];                // available GGUF models
    let PLANNER = {boards: []};     // kanban boards + tasks
    let activeBoardId = null;       // currently shown board
    let activeType = "all";
    let activeView = "opsroom";  // home shows favourites by default
    let setupPoll = null;           // interval id for the running setup job
    let llmPoll = null;             // interval id for llm status/log polling
    let metricsPoll = null;         // interval id for system load polling
    let modelsLoaded = false;       // lazy-load the model list once

    const TYPE_COLORS = {
      node: "bg-green-900/40 text-green-300 border-green-700",
      django: "bg-emerald-900/40 text-emerald-300 border-emerald-700",
      streamlit: "bg-red-900/40 text-red-300 border-red-700",
      fastapi: "bg-teal-900/40 text-teal-300 border-teal-700",
      flask: "bg-cyan-900/40 text-cyan-300 border-cyan-700",
      python: "bg-blue-900/40 text-blue-300 border-blue-700",
      rust: "bg-orange-900/40 text-orange-300 border-orange-700",
      go: "bg-sky-900/40 text-sky-300 border-sky-700",
      static: "bg-purple-900/40 text-purple-300 border-purple-700",
      script: "bg-yellow-900/40 text-yellow-300 border-yellow-700",
      make: "bg-pink-900/40 text-pink-300 border-pink-700",
      unknown: "bg-slate-800 text-slate-400 border-slate-700",
    };
    const typeClass = t => TYPE_COLORS[t] || TYPE_COLORS.unknown;

    /** Placeholder cards so the first load shows shape, not a blank page. */
    function renderSkeleton(n) {
      const grid = $("#grid");
      if (!grid || grid.children.length) return;   // never clobber real content
      grid.innerHTML = Array.from({ length: n || 6 }, () => `
        <div class="bg-slate-800/40 border border-slate-700 rounded-xl p-4" aria-hidden="true">
          <div class="skeleton h-4 w-2/3 mb-3"></div>
          <div class="skeleton h-3 w-1/3 mb-4"></div>
          <div class="skeleton h-8 w-full"></div>
        </div>`).join("");
      grid.setAttribute("aria-busy", "true");
    }

    let _loadedOnce = false;

    async function load() {
      try {
        await _loadInner();
        _loadedOnce = true;
        const grid = $("#grid");
        if (grid) grid.removeAttribute("aria-busy");
      } catch (e) {
        const grid = $("#grid");
        if (grid) grid.removeAttribute("aria-busy");
        // Keep whatever is on screen if we have loaded before — stale data
        // beats a blank page — but say clearly that it is stale.
        if (_loadedOnce) {
          toast(`Could not refresh: ${e.message || e}`, "error");
        } else if (grid) {
          grid.innerHTML = `
            <div class="col-span-full bg-slate-800/60 border border-red-800 rounded-xl p-6 text-center">
              <p class="text-red-300 font-medium mb-1">Could not load your apps</p>
              <p class="text-slate-400 text-sm mb-4">${escapeHtml(String(e.message || e))}</p>
              <button id="retry-load"
                class="bg-indigo-600 hover:bg-indigo-500 rounded-lg px-4 py-2 text-sm">Retry</button>
            </div>`;
          const rb = $("#retry-load");
          if (rb) rb.onclick = () => load();
        }
      }
    }

    async function _loadInner() {
      if (!_loadedOnce) renderSkeleton(6);
      const [data, vsc, llm, plan] = await Promise.all([
        api("/api/apps"),
        api("/api/vscode/folders").catch(() => ({folders:[]})),
        api("/api/llm/status").catch(() => ({})),
        api("/api/planner").catch(() => ({boards:[]})),
      ]);
      ALL = data.apps;
      ROOTS = data.roots || [];
      // If the remembered view points at a root that no longer exists, reset.
      if (activeView.startsWith("root:") && !ROOTS.includes(activeView.slice(5)))
        activeView = "opsroom";
      VSCODE = vsc.folders || [];
      LLM = llm || {};
      PLANNER = plan && plan.boards ? plan : {boards: []};
      if (!activeBoardId && PLANNER.boards.length) activeBoardId = PLANNER.boards[0].id;
      let sub = `${data.count} apps · ${ROOTS.map(escapeHtml).join(' · ')}`;
      const cs = ALL.filter(a => a.claude_session);
      if (cs.length) {
        sub += ` · <span class="text-indigo-300">${cs.length} Claude session`
          + `${cs.length > 1 ? 's' : ''}: ${cs.map(a => escapeHtml(a.name)).join(', ')}</span>`;
      }
      $("#subtitle").innerHTML = sub;
      renderViews();
      renderFilters();
      render();
    }

    function favCount() { return ALL.filter(a => a.favourite).length; }

    // Apps in the current view (favourites / a specific root), before
    // type/search filters.
    function viewApps() {
      if (activeView === "favourites") return ALL.filter(a => a.favourite);
      if (activeView === "uncommitted") {
        const names = new Set((OVERVIEW && OVERVIEW.dirty || []).map(r => r.name));
        return ALL.filter(a => names.has(a.name));
      }
      if (activeView === "failed") {
        const names = new Set((OVERVIEW && OVERVIEW.failed || []).map(r => r.name));
        return ALL.filter(a => names.has(a.name));
      }
      if (activeView.startsWith("root:")) {
        const label = activeView.slice(5);
        return ALL.filter(a => a.root_label === label);
      }
      return ALL;
    }
    function firstRootView() { return ROOTS.length ? `root:${ROOTS[0]}` : "favourites"; }


    // ================= Ops Room view =================================
    let OVERVIEW = null;
    let _ovLoading = false;
    let _ovError = null;

    async function loadOverview(force) {
      if (_ovLoading) return;
      _ovLoading = true;
      try {
        OVERVIEW = await api("/api/overview" + (force ? "?force=true" : ""), { timeoutMs: 90000 });
        _ovError = null;
      } catch (e) {
        // Record the failure rather than toasting here: renderOpsRoom() calls
        // this and re-renders on completion, so toasting on every attempt
        // produced an unbounded storm when the endpoint was down.
        _ovError = e.message || String(e);
      } finally {
        _ovLoading = false;
      }
    }

    function fmtUptime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
      return `${m}m`;
    }

    function sectionRule(dotState, label, right) {
      return `<div class="gso-rule">
        <span class="gso-dot${dotState === "live" ? " gso-pulse" : ""}" data-state="${dotState}" aria-hidden="true"></span>
        <span class="gso-rule-label">${escapeHtml(label)}</span>
        <span class="gso-rule-line"></span>
        ${right ? `<span style="font-size:11.5px;color:var(--text-3);flex:none">${right}</span>` : ""}
      </div>`;
    }

    function renderOpsRoom() {
      const grid = $("#grid");
      grid.style.display = "block";
      grid.className = "ops-view";

      if (_ovError) {
        grid.innerHTML = `<div class="ops-empty" style="border-color:var(--err-line)">
          <div class="ops-empty-t" style="color:var(--err-text)">Could not read your machine</div>
          <div class="ops-empty-s">${escapeHtml(_ovError)}</div>
          <button class="ops-pill-live" id="ov-retry">Try again</button></div>`;
        const r = $("#ov-retry");
        if (r) r.onclick = async () => {
          _ovError = null; renderOpsRoom();
          await loadOverview(true);
          if (activeView === "opsroom") renderOpsRoom();
        };
        return;
      }
      if (!OVERVIEW) {
        grid.innerHTML = `<div class="ops-empty"><div class="ops-empty-t">Reading your machine&hellip;</div>
          <div class="ops-empty-s">Scanning repos and running processes.</div></div>`;
        if (!_ovLoading) {
          loadOverview().then(() => { if (activeView === "opsroom") renderOpsRoom(); });
        }
        return;
      }

      const c = OVERVIEW.counts || {};
      const hour = new Date().getHours();
      const greet = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
      $("#view-title").textContent = `${greet}, Rafsun`;
      $("#subtitle").textContent =
        `${c.live || 0} running · ${c.dirty || 0} uncommitted · ${c.failed || 0} failed runs`;

      // ---- LIVE
      const live = OVERVIEW.live || [];
      const liveBody = live.length
        ? `<div class="ops-live-grid">${live.map(a => `
            <div class="ops-live-card">
              <div class="ops-live-head">
                <span class="ops-live-name">${escapeHtml(a.name)}</span>
                ${a.port ? `<span class="ops-live-port">:${a.port}</span>` : ""}
              </div>
              <div class="ops-live-meta">${escapeHtml(a.type || "process")}${a.pid ? ` · pid ${a.pid}` : ""}</div>
              <div class="ops-live-foot">
                <span class="ops-live-up">up ${fmtUptime(a.uptime_seconds)}</span>
                <button class="ops-stop" data-stop="${escapeHtml(a.name)}"
                  aria-label="Stop ${escapeHtml(a.name)}">Stop</button>
              </div>
            </div>`).join("")}</div>`
        : `<div class="ops-empty">
             <div class="ops-empty-t">Nothing running</div>
             <div class="ops-empty-s">Start a repo from the Library, or ask Ops Room to bring up your usual stack.</div>
             <button class="ops-pill-live" data-goto="library">Browse the Library</button>
           </div>`;

      // ---- NEEDS YOU
      const dirty = (OVERVIEW.dirty || []).slice(0, 6);
      const unsynced = (OVERVIEW.unsynced || []).slice(0, 3);
      const rows = [
        ...dirty.map(r => ({
          name: r.name, metric: `${r.changed_count} changed`,
          ctx: `on ${r.branch || "?"}${r.last_commit ? " · " + r.last_commit.slice(0, 60) : ""}`,
          primary: "Open", kind: "warn",
        })),
        ...unsynced.map(r => ({
          name: r.name,
          metric: r.behind ? `behind ${r.behind}` : `ahead ${r.ahead}`,
          ctx: `branch ${r.branch || "?"}`, primary: "Open", kind: "warn",
        })),
        ...(OVERVIEW.failed || []).slice(0, 3).map(f => ({
          name: f.name, metric: f.state || `exit ${f.exit_code}`,
          ctx: "last run did not stay up", primary: "Logs", kind: "err",
        })),
      ];
      const needsBody = rows.length
        ? `<div class="ops-rows">${rows.map(r => `
            <div class="ops-row" data-kind="${r.kind}">
              <span class="ops-row-name">${escapeHtml(r.name)}</span>
              <span class="ops-row-metric">${escapeHtml(r.metric)}</span>
              <span class="ops-row-ctx">${escapeHtml(r.ctx)}</span>
              <button class="ops-link" data-open="${escapeHtml(r.name)}">${r.primary}</button>
            </div>`).join("")}</div>`
        : `<div class="ops-empty"><div class="ops-empty-t">Everything is committed</div>
             <div class="ops-empty-s">No dirty repos, nothing out of sync, no failed runs.</div></div>`;

      // ---- ROUTINES
      const routines = [
        { label: "Rescan projects", act: "rescan", hint: "Re-read every repo" },
        { label: "Sweep git state", act: "sweep", hint: "Refresh dirty counts" },
        { label: "Open Ops Room", act: "ops", hint: "Ask the assistant" },
        { label: "Browse Library", act: "library", hint: `${c.apps || 0} apps` },
      ];

      // ---- RECENT
      const recent = ALL.slice(0, 8);

      grid.innerHTML = `
        <section>${sectionRule("live", "Live", `${c.live || 0} of ${c.apps || 0} up`)}
          <div style="margin-top:11px">${liveBody}</div></section>
        <section>${sectionRule("warn", "Needs you", rows.length ? `${rows.length} items` : "")}
          <div style="margin-top:11px">${needsBody}</div></section>
        <section>${sectionRule("brand", "Routines", "")}
          <div style="margin-top:11px" class="ops-routines">${routines.map(r =>
            `<button class="ops-routine" data-routine="${r.act}" title="${escapeHtml(r.label)} · ${escapeHtml(r.hint)}">${escapeHtml(r.label)}</button>`).join("")}</div></section>
        <section>${sectionRule("editor", "Recent", `${c.repos || 0} repos`)}
          <div style="margin-top:11px" class="ops-chips">${recent.map(a =>
            `<button class="ops-chip" data-open="${escapeHtml(a.name)}">
              <span class="gso-dot" data-state="${a.running ? "live" : ""}" aria-hidden="true"></span>
              ${escapeHtml(a.name)}</button>`).join("")}
            <button class="ops-chip" data-more="1" data-goto="library">+${Math.max(0, (c.apps || 0) - recent.length)} more</button>
          </div></section>`;

      grid.querySelectorAll("[data-stop]").forEach(b =>
        b.onclick = () => toggleRun(b.dataset.stop, true));
      grid.querySelectorAll("[data-open]").forEach(b =>
        b.onclick = () => openDrawer(b.dataset.open));
      grid.querySelectorAll("[data-goto]").forEach(b =>
        b.onclick = () => selectView(b.dataset.goto));
      grid.querySelectorAll("[data-routine]").forEach(b => b.onclick = async () => {
        const a = b.dataset.routine;
        if (a === "library") return selectView("library");
        if (a === "ops") return $("#ops-open").click();
        b.disabled = true; b.textContent = "Working…";
        await loadOverview(true);
        if (a === "rescan") await load();
        renderOpsRoom();
        toast("Refreshed", "success");
      });
    }

    /** Sidebar nav, per the handoff's four groups. */
    function navGroups() {
      const liveCount = ALL.filter(a => a.running).length;
      const rootItems = ROOTS.map(label => ({
        id: `root:${label}`, label,
        n: ALL.filter(a => a.root_label === label).length,
      }));
      return [
        { label: "Workspace", items: [
          { id: "opsroom", label: "Ops Room", dot: "live", pulse: true, n: liveCount, action: "dock" },
          { id: "library",  label: "Library",  dot: "brand", n: ALL.length },
        ]},
        { label: "Attention", items: [
          // These three need per-repo git and health state in the list payload,
          // which /api/apps does not yet return — wired up in a later phase.
          { id: "uncommitted", label: "Uncommitted", dot: "warn",
            n: OVERVIEW ? OVERVIEW.counts.dirty : null },
          { id: "failed", label: "Failed runs", dot: "err",
            n: OVERVIEW ? OVERVIEW.counts.failed : null },
          { id: "vscode",      label: "In VSCode",   dot: "editor", n: VSCODE.length },
        ]},
        { label: "Collections", items: [
          { id: "favourites", label: "Favourites", n: favCount() },
          ...rootItems,
          { id: "archived", label: "Archived", n: null, disabled: "No archive concept yet" },
        ]},
        { label: "Tools", items: [
          { id: "planner", label: "Planner", n: PLANNER.boards ? PLANNER.boards.length : null },
          { id: "llm",     label: "Local LLM", dot: LLM && LLM.healthy ? "live" : null, n: null },
          { id: "chat",    label: "Chat", n: null },
          { id: "site",    label: "Site", n: null },
        ]},
      ];
    }

    const RAIL = [
      { id: "opsroom", short: "OPS" }, { id: "library", short: "REPO" },
      { id: "planner", short: "PLAN" }, { id: "llm", short: "LLM" }, { id: "site", short: "SITE" },
    ];

    function renderViews() {
      const nav = $("#side-nav");
      if (nav) {
        nav.innerHTML = navGroups().map(g => `
          <div class="gso-group" role="group" aria-label="${escapeHtml(g.label)}">
            <div class="gso-group-label">${escapeHtml(g.label)}</div>
            ${g.items.map(it => {
              const active = it.id === activeView;
              const dot = it.dot
                ? `<span class="gso-dot${it.pulse ? " gso-pulse" : ""}" data-state="${it.dot}" aria-hidden="true"></span>`
                : "";
              const count = it.n !== null && it.n !== undefined
                ? `<span class="gso-nav-count">${it.n}</span>` : "";
              return `<button class="gso-nav" data-view="${it.id}"
                ${active ? 'aria-current="page"' : ""}
                ${it.disabled ? `disabled title="${escapeHtml(it.disabled)}"` : ""}>
                ${dot}<span class="gso-nav-label">${escapeHtml(it.label)}</span>${count}</button>`;
            }).join("")}
          </div>`).join("");

        nav.querySelectorAll("button[data-view]").forEach(b => {
          b.onclick = () => selectView(b.dataset.view);
        });
      }

      const rail = $("#rail-nav");
      if (rail) {
        rail.innerHTML = RAIL.map(r => `<button class="gso-rail-btn" data-view="${r.id}"
          ${r.id === activeView ? 'aria-current="page"' : ""}
          title="${escapeHtml(r.short)}" aria-label="${escapeHtml(r.short)}">${r.short}</button>`).join("");
        rail.querySelectorAll("button").forEach(b => b.onclick = () => selectView(b.dataset.view));
      }

      const t = $("#view-title");
      if (t) t.textContent = viewTitle();
    }

    function viewTitle() {
      const map = { opsroom: "Ops Room", library: "Library", vscode: "In VSCode",
                    uncommitted: "Uncommitted", failed: "Failed runs",
                    favourites: "Favourites", planner: "Planner", llm: "Local LLM",
                    chat: "Chat", site: "Site" };
      if (activeView.startsWith("root:")) return activeView.slice(5);
      return map[activeView] || "Library";
    }

    function selectView(id) {
      // Ops Room is a dock, not a page — until its own view lands.
      activeView = id;
      activeType = "all";
      if ((id === "uncommitted" || id === "failed") && !OVERVIEW) {
        loadOverview().then(() => { renderViews(); render(); });
      }
      try { localStorage.setItem("gsoView", id); } catch (e) {}
      renderViews(); renderFilters(); render();
      announce(viewTitle() + " view");
    }

    function renderFilters() {
      const base = viewApps();
      const counts = {};
      base.forEach(a => counts[a.type] = (counts[a.type]||0)+1);
      const types = ["all", ...Object.keys(counts).sort()];
      $("#filters").innerHTML = types.map(t => {
        const n = t === "all" ? base.length : counts[t];
        const active = t === activeType;
        return `<button data-type="${t}"
          class="px-3 py-1 rounded-full border ${active ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}">
          ${t} <span class="opacity-60">${n}</span></button>`;
      }).join("");
      $("#filters").querySelectorAll("button").forEach(b =>
        b.onclick = () => { activeType = b.dataset.type; renderFilters(); render(); });
    }

    function render() {
      const isGrid = (activeView === "favourites" || activeView.startsWith("root:"));
      $("#filters").style.display = isGrid ? "flex" : "none";
      if (metricsPoll && activeView !== "llm") { clearInterval(metricsPoll); metricsPoll = null; }
      if (activeView === "opsroom") return renderOpsRoom();
      if (activeView === "vscode") return renderVscode();
      if (activeView === "llm") return renderLlm();
      if (activeView === "planner") return renderPlanner();
      if (activeView === "chat") return renderChat();
      if (activeView === "site") return renderSite();

      const gridEl = $("#grid");
      gridEl.className = "";
      gridEl.style.display = "block";
      const q = $("#search").value.toLowerCase();
      const apps = viewApps().filter(a =>
        (activeType === "all" || a.type === activeType) &&
        a.name.toLowerCase().includes(q));
      // Say why nothing matched, and offer the way out — a bare "No matching
      // apps." leaves the user to work out which of search/filter is hiding them.
      const reasons = [];
      if (q) reasons.push(`search &ldquo;${escapeHtml($("#search").value)}&rdquo;`);
      if (activeType !== "all") reasons.push(`type <strong>${escapeHtml(activeType)}</strong>`);
      let empty = `<div class="col-span-full text-center py-16 text-slate-500">
          <p class="text-lg mb-1">No apps match</p>
          <p class="text-sm mb-4">${reasons.length
            ? `Filtered by ${reasons.join(" and ")}.`
            : "This view has nothing in it yet."}</p>
          ${reasons.length
            ? `<button id="clear-filters"
                 class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-4 py-2 text-sm">
                 Clear filters</button>`
            : ""}
        </div>`;
      if (activeView === "favourites" && favCount() === 0) {
        empty = `<div class="col-span-full text-center py-16 text-slate-500">
          <p class="text-lg mb-1">No favourites yet</p>
          <p class="text-sm">Click the ☆ on any app card, or switch to
          <button id="goto-all" class="text-indigo-400 hover:underline">your projects</button> to browse.</p>
        </div>`;
      }
      const c = (OVERVIEW && OVERVIEW.counts) || {};
      // Status strip: state before catalogue — these double as filters.
      const strip = `<div class="lib-strip">
        <button class="lib-stat" data-goto="opsroom">
          <span class="lib-stat-h"><span class="gso-dot gso-pulse" data-state="live" aria-hidden="true"></span>Running now</span>
          <span class="lib-stat-v"><span class="lib-stat-n">${c.live ?? "–"}</span><span class="lib-stat-s">processes</span></span>
        </button>
        <button class="lib-stat" data-goto="uncommitted" ${activeView === "uncommitted" ? 'aria-current="page"' : ""}>
          <span class="lib-stat-h"><span class="gso-dot" data-state="warn" aria-hidden="true"></span>Uncommitted work</span>
          <span class="lib-stat-v"><span class="lib-stat-n">${c.dirty ?? "–"}</span><span class="lib-stat-s">repos dirty</span></span>
        </button>
        <button class="lib-stat" data-goto="vscode" ${activeView === "vscode" ? 'aria-current="page"' : ""}>
          <span class="lib-stat-h"><span class="gso-dot" data-state="editor" aria-hidden="true"></span>Open in VSCode</span>
          <span class="lib-stat-v"><span class="lib-stat-n">${VSCODE.length}</span><span class="lib-stat-s">windows</span></span>
        </button>
        <button class="lib-stat" data-goto="failed" ${activeView === "failed" ? 'aria-current="page"' : ""}>
          <span class="lib-stat-h"><span class="gso-dot" data-state="err" aria-hidden="true"></span>Failed runs</span>
          <span class="lib-stat-v"><span class="lib-stat-n">${c.failed ?? "–"}</span><span class="lib-stat-s">need a look</span></span>
        </button>
      </div>`;
      $("#grid").innerHTML = strip +
        (apps.length ? `<div class="lib-grid">${apps.map(card).join("")}</div>` : empty);
      $("#grid").querySelectorAll("[data-goto]").forEach(b =>
        b.onclick = () => selectView(b.dataset.goto));
      const clearBtn = $("#clear-filters");
      if (clearBtn) clearBtn.onclick = () => {
        $("#search").value = "";
        activeType = "all";
        renderFilters(); render();
        announce("Filters cleared");
      };
      const gotoAll = $("#goto-all");
      if (gotoAll) gotoAll.onclick = () => {
        activeView = firstRootView(); renderViews(); renderFilters(); render();
      };
      apps.forEach(a => {
        const cardEl = $(`#card-${cssId(a.name)}`);
        cardEl.onclick = (e) => {
          if (e.target.closest("button")) return;
          openDrawer(a.name);
        };
        // role="button" carries an expectation of Enter/Space; a div does not
        // provide it, so wire it explicitly.
        cardEl.onkeydown = (e) => {
          if (e.target.closest("button")) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openDrawer(a.name);
          }
        };
        const sb = cardEl.querySelector("[data-run]");
        if (sb) sb.onclick = (e) => {
          e.stopPropagation();
          announce(`${a.running ? "Stopping" : "Starting"} ${a.name}`);
          toggleRun(a.name, a.running);
        };
        const cfgb = cardEl.querySelector("[data-cfg]");
        if (cfgb) cfgb.onclick = (e) => { e.stopPropagation(); openDrawer(a.name); };
        const fb = $(`#fav-${cssId(a.name)}`);
        if (fb) fb.onclick = () => toggleFav(a.name);
        const vb = $(`#vsc-${cssId(a.name)}`);
        if (vb) vb.onclick = () => openVscode(a.name);
      });
    }

    // ---- Chat: Claude Code on the local LLM, streamed into this UI ----
    function chatBubble(m) {
      if (m.role === "user")
        return `<div class="flex justify-end"><div class="bg-indigo-600 text-white rounded-2xl rounded-br-sm px-3 py-2 text-sm max-w-[80%] whitespace-pre-wrap">${escapeHtml(m.text)}</div></div>`;
      if (m.role === "assistant")
        return `<div class="flex justify-start"><div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-bl-sm px-3 py-2 text-sm max-w-[80%] whitespace-pre-wrap">${escapeHtml(m.text)}</div></div>`;
      if (m.role === "action")
        return `<div class="text-xs text-slate-500 mono pl-1">🔧 ${escapeHtml(m.text)}</div>`;
      if (m.role === "meta")
        return `<div class="text-[11px] text-slate-600 pl-1">${escapeHtml(m.text)}</div>`;
      if (m.role === "error")
        return `<div class="text-red-400 text-sm pl-1">${escapeHtml(m.text)}</div>`;
      if (m.role === "result")
        return `<details class="text-xs text-slate-500 pl-1"><summary class="cursor-pointer">tool output</summary><pre class="mono whitespace-pre-wrap bg-black/40 rounded p-2 mt-1 text-slate-400 max-h-48 overflow-auto">${escapeHtml(m.text)}</pre></details>`;
      return "";
    }

    function chatTick() {
      api("/api/chat").then(d => {
        CHAT = d;
        if (activeView === "chat") render();
        if (activeView === "chat" && d && d.busy) setTimeout(chatTick, 1200);
        else chatPolling = false;
      }).catch(() => { chatPolling = false; });
    }
    function startChatPoll() { if (!chatPolling) { chatPolling = true; setTimeout(chatTick, 800); } }

    async function renderChat() {
      if (!CHAT) {
        try { CHAT = await api("/api/chat"); }
        catch { CHAT = {messages:[], status:"done", llm:{state:"stopped"}}; }
      }
      const st = CHAT.llm || {};
      const llmDown = st.state !== "running";
      const busy = !!CHAT.busy;
      const items = CHAT.messages || [];
      const bubbles = items.map(chatBubble).join("") ||
        `<p class="text-slate-500 text-sm">Powered by Claude Code on your local LLM, working in <span class="mono">${escapeHtml(CHAT.dir||'~')}</span>.
         Ask anything about your computer — e.g. "what's using my disk?", "summarise this folder", "create a scratch script". Read-only tools run automatically; commands ask first.</p>`;
      const banner = llmDown ? `<div class="border border-slate-700 bg-slate-800/60 rounded-xl p-3 mb-3 text-sm text-slate-300">
          The local LLM isn't running. <button id="chat-goto-llm" class="text-indigo-400 hover:underline">Start it in Local LLM</button> to chat.</div>` : "";
      const errBox = CHAT.error ? `<div class="text-red-400 text-sm my-2">${escapeHtml(CHAT.error)}</div>` : "";
      let approval = "";
      if (CHAT.action) {
        approval = `<div class="border border-amber-700 bg-amber-900/30 rounded-xl p-3 my-2">
          <div class="text-xs text-amber-300 mb-1">Allow Claude to run <span class="font-semibold">${escapeHtml(CHAT.action.tool||'this tool')}</span>?</div>
          <pre class="mono text-xs text-slate-200 whitespace-pre-wrap mb-2">${escapeHtml(CHAT.action.command)}</pre>
          <div class="flex gap-2">
            <button id="chat-allow" class="px-3 py-1.5 rounded-lg bg-green-600 hover:bg-green-500 text-white text-sm">Allow</button>
            <button id="chat-deny" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm">Deny</button>
          </div></div>`;
      }
      const disabled = busy || llmDown;
      $("#grid").innerHTML = `
        <div class="col-span-full max-w-3xl mx-auto w-full">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-semibold text-white">Chat <span class="text-xs text-slate-500">Claude Code · local LLM</span></h2>
            <button id="chat-clear" class="text-xs text-slate-400 hover:text-white">Clear</button>
          </div>
          ${banner}
          <div id="chat-log" class="space-y-3 mb-3">${bubbles}${errBox}${approval}
            ${busy && !CHAT.action ? `<div class="text-xs text-slate-500 pl-1">working…</div>` : ""}</div>
          <div class="flex items-end gap-2">
            <textarea id="chat-input" rows="2" ${disabled?'disabled':''} placeholder="Ask Claude about your computer…"
              class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm resize-y focus:outline-none focus:border-indigo-500"></textarea>
            <button id="chat-send" ${disabled?'disabled':''}
              class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white text-sm font-medium">${busy?'…':'Send'}</button>
          </div>
        </div>`;
      const goto = $("#chat-goto-llm"); if (goto) goto.onclick = () => { activeView="llm"; renderViews(); render(); };
      const clr = $("#chat-clear"); if (clr) clr.onclick = async () => { CHAT = await api("/api/chat/reset",{method:"POST"}); render(); };
      const allow = $("#chat-allow"); if (allow) allow.onclick = () => chatApprove(true);
      const deny = $("#chat-deny"); if (deny) deny.onclick = () => chatApprove(false);
      const send = $("#chat-send"); if (send) send.onclick = () => chatSend();
      const input = $("#chat-input");
      if (input && !disabled) {
        input.focus();
        input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); } };
      }
      const log = $("#chat-log"); if (log) log.scrollTop = log.scrollHeight;
    }

    async function chatSend() {
      const input = $("#chat-input"); if (!input) return;
      const text = input.value.trim(); if (!text || (CHAT && CHAT.busy)) return;
      try { CHAT = await api("/api/chat/send", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({message:text})}); }
      catch (e) { CHAT = {...(CHAT||{messages:[]}), error:String(e)}; }
      render(); startChatPoll();
    }

    async function chatApprove(ok) {
      if (!CHAT || !CHAT.action) return;
      try { CHAT = await api("/api/chat/approve", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id: CHAT.action.id, approve: ok})}); }
      catch (e) { CHAT = {...(CHAT||{messages:[]}), error:String(e)}; }
      render(); startChatPoll();
    }

    // ---- Site CMS (edit the Jekyll website) ----
    function siteFieldHtml(key, val) {
      const k = escapeHtml(key);
      const label = `<label class="block text-[12px] text-slate-400 mb-0.5">${k}</label>`;
      if (typeof val === "boolean")
        return `<label class="flex items-center gap-2 text-sm text-slate-300"><input type="checkbox" data-key="${k}" data-type="bool" ${val?'checked':''}/> ${k}</label>`;
      if (typeof val === "number")
        return `<div>${label}<input data-key="${k}" data-type="number" value="${escapeHtml(String(val))}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm mono"/></div>`;
      if (Array.isArray(val))
        return `<div>${label}<textarea data-key="${k}" data-type="list" rows="${Math.max(2,val.length)}" placeholder="one per line" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm mono">${escapeHtml(val.join("\n"))}</textarea></div>`;
      if (val && typeof val === "object")
        return `<div>${label}<textarea data-key="${k}" data-type="json" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs mono">${escapeHtml(JSON.stringify(val,null,2))}</textarea></div>`;
      const s = val==null ? "" : String(val);
      return `<div>${label}${s.length>60
        ? `<textarea data-key="${k}" data-type="str" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm">${escapeHtml(s)}</textarea>`
        : `<input data-key="${k}" data-type="str" value="${escapeHtml(s)}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm"/>`}</div>`;
    }

    function siteCollectFm() {
      const fm = {};
      $$("#site-editor [data-key]").forEach(el => {
        const k = el.dataset.key, t = el.dataset.type;
        if (t === "bool") fm[k] = el.checked;
        else if (t === "number") { const n = parseFloat(el.value); fm[k] = isNaN(n) ? el.value : n; }
        else if (t === "list") fm[k] = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
        else if (t === "json") { try { fm[k] = JSON.parse(el.value); } catch { fm[k] = el.value; } }
        else fm[k] = el.value;
      });
      return fm;
    }

    function siteEditorHtml() {
      if (!siteFile) return `<div class="text-slate-500 text-sm">Select an item to edit, or click <span class="text-indigo-400">+ New</span>.</div>`;
      if (!siteItem) return `<div class="text-slate-500 text-sm">Loading…</div>`;
      const fm = siteItem.frontmatter || {};
      const fields = Object.keys(fm).map(key => siteFieldHtml(key, fm[key])).join("");
      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="mono text-xs text-slate-500">${escapeHtml(siteColl)}/${escapeHtml(siteFile)}</span>
            <button id="site-save" ${siteBusy?'disabled':''} class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white text-sm">Save</button>
          </div>
          <div class="bg-slate-800/40 border border-slate-700 rounded-xl p-3 space-y-2">
            <div class="text-[11px] uppercase tracking-wide text-slate-500">Fields</div>
            ${fields || '<p class="text-xs text-slate-500">No front-matter fields.</p>'}
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <div class="text-[11px] uppercase tracking-wide text-slate-500 mb-1">Body (Markdown)</div>
              <textarea id="site-body" class="w-full h-[52vh] bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm mono resize-none focus:outline-none focus:border-indigo-500">${escapeHtml(siteItem.body||'')}</textarea>
            </div>
            <div>
              <div class="text-[11px] uppercase tracking-wide text-slate-500 mb-1">Preview</div>
              <div id="site-preview" class="h-[52vh] overflow-auto bg-slate-900/40 border border-slate-800 rounded-xl p-3 text-sm text-slate-200"></div>
            </div>
          </div>
        </div>`;
    }

    function siteWireEditor() {
      const body = $("#site-body"), prev = $("#site-preview");
      if (body && prev) {
        const upd = () => { prev.innerHTML = (window.marked ? marked.parse(body.value||"") : escapeHtml(body.value||"")); };
        body.oninput = upd; upd();
      }
      const save = $("#site-save"); if (save) save.onclick = siteSave;
    }

    async function renderSite() {
      if (!SITE) {
        $("#grid").innerHTML = `<div class="col-span-full text-slate-500 text-sm">Loading site…</div>`;
        try { SITE = await api("/api/site"); } catch { SITE = {configured:false}; }
        if (SITE.configured && (SITE.collections||[]).length && !siteColl) {
          siteColl = SITE.collections[0].id;
          try { siteItems = (await api("/api/site/"+encodeURIComponent(siteColl))).items || []; } catch {}
        }
      }
      if (!SITE.configured) {
        $("#grid").innerHTML = `<div class="col-span-full text-slate-400 text-sm">
          Site repo not found at <span class="mono">${escapeHtml(SITE.dir||'')}</span>.
          Clone it there, or set <span class="mono">MANAGER_SITE_DIR</span> and restart GSO-1.</div>`;
        return;
      }
      const cols = SITE.collections || [];
      const colBtns = cols.map(c =>
        `<button data-coll="${c.id}" class="w-full text-left px-3 py-2 rounded-lg text-sm ${c.id===siteColl?'bg-indigo-600 text-white':'text-slate-300 hover:bg-slate-800'}">
           ${escapeHtml(c.label)} <span class="opacity-60">${c.count}</span></button>`).join("");
      const itemBtns = siteItems.map(it =>
        `<button data-file="${escapeHtml(it.file)}" title="${escapeHtml(it.title)}" class="w-full text-left px-3 py-1.5 rounded text-[13px] truncate ${it.file===siteFile?'bg-slate-700 text-white':'text-slate-400 hover:bg-slate-800'}">
           ${escapeHtml(it.title)}</button>`).join("") || `<p class="text-xs text-slate-500 px-2">No items.</p>`;
      const st = SITE.status || {};
      const changed = st.changed_count || 0;
      $("#grid").innerHTML = `
        <div class="col-span-full">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-semibold text-white">Site — your-site.github.io
              <span class="text-xs text-slate-500">(${escapeHtml(st.branch||'')})</span></h2>
            <div class="flex items-center gap-3">
              <span class="text-xs ${changed?'text-amber-300':'text-slate-500'}">${changed?changed+' file'+(changed>1?'s':'')+' changed':'no changes'}</span>
              <button id="site-publish" ${siteBusy?'disabled':''} class="px-3 py-1.5 rounded-lg bg-green-600 hover:bg-green-500 disabled:opacity-50 text-white text-sm font-medium">Publish to GitHub</button>
            </div>
          </div>
          <div class="grid grid-cols-[230px_1fr] gap-4 items-start">
            <div class="space-y-3">
              <div class="space-y-1">${colBtns}</div>
              <div class="border-t border-slate-800 pt-2">
                <div class="flex items-center justify-between px-1 mb-1">
                  <span class="text-[11px] uppercase tracking-wide text-slate-500">Items</span>
                  <button id="site-new" class="text-xs text-indigo-400 hover:underline">+ New</button>
                </div>
                <div class="space-y-0.5 max-h-[64vh] overflow-auto">${itemBtns}</div>
              </div>
            </div>
            <div id="site-editor" class="bg-slate-800/40 border border-slate-700 rounded-xl p-4">${siteEditorHtml()}</div>
          </div>
        </div>`;
      $$("#grid [data-coll]").forEach(b => b.onclick = () => siteSelectCollection(b.dataset.coll));
      $$("#grid [data-file]").forEach(b => b.onclick = () => siteSelectItem(b.dataset.file));
      const pub = $("#site-publish"); if (pub) pub.onclick = sitePublish;
      const nw = $("#site-new"); if (nw) nw.onclick = siteNew;
      siteWireEditor();
    }

    async function siteSelectCollection(coll) {
      siteColl = coll; siteFile = null; siteItem = null; siteItems = []; renderSite();
      try { siteItems = (await api("/api/site/"+encodeURIComponent(coll))).items || []; } catch {}
      renderSite();
    }

    async function siteSelectItem(file) {
      siteFile = file; siteItem = null; renderSite();
      try { siteItem = await api(`/api/site/${encodeURIComponent(siteColl)}/${encodeURIComponent(file)}`); } catch {}
      renderSite();
    }

    async function siteSave() {
      if (!siteFile || siteBusy) return;
      siteItem = { frontmatter: siteCollectFm(), body: ($("#site-body")||{}).value || "" };
      siteBusy = true; renderSite();
      try {
        await api(`/api/site/${encodeURIComponent(siteColl)}/${encodeURIComponent(siteFile)}`,
          {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(siteItem)});
        SITE = await api("/api/site");
        flash("Saved "+siteFile, true);
      } catch (e) { flash("Save failed", false); }
      siteBusy = false; renderSite();
    }

    async function siteNew() {
      const file = prompt("New file name (e.g. 2025-06-20-my-post.md):");
      if (!file) return;
      const title = prompt("Title:") || "Untitled";
      siteBusy = true; renderSite();
      try {
        const r = await api("/api/site/"+encodeURIComponent(siteColl),
          {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({file, frontmatter:{title}, body:"Write your content here.\n"})});
        if (r.ok) { siteItems = (await api("/api/site/"+encodeURIComponent(siteColl))).items || []; siteBusy=false; await siteSelectItem(r.file); SITE = await api("/api/site"); flash("Created "+r.file, true); return; }
        flash(r.output || "Create failed", false);
      } catch (e) { flash("Create failed", false); }
      siteBusy = false; renderSite();
    }

    async function sitePublish() {
      if (siteBusy) return;
      const msg = prompt("Commit message:", "Update site content");
      if (msg === null) return;
      siteBusy = true; renderSite();
      try {
        const r = await api("/api/site/publish", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({message: msg})});
        if (r.ok) flash(r.nochange ? "Nothing to publish." : "Published — GitHub Pages will rebuild shortly.", true);
        else flash("Publish failed: "+(r.output||r.pushed||""), false);
        SITE = await api("/api/site");
      } catch (e) { flash("Publish failed", false); }
      siteBusy = false; renderSite();
    }

    async function openVscode(name) {
      let r;
      try { r = await api(`/api/apps/${encodeURIComponent(name)}/vscode/open`, {method:"POST"}); }
      catch (e) { toast(`Open in VS Code failed: ${e.message || e}`, "error"); return; }
      flash(r.message || (r.ok?"Opening…":"Failed"), r.ok);
      // Window state takes a moment to update; refresh shortly after.
      setTimeout(load, 1500);
    }

    // -------- "Opened in VSCode" view --------
    function renderVscode() {
      const gridEl = $("#grid");

        $("#grid").innerHTML = `<div class="col-span-full text-center py-16 text-slate-500">
          <p class="text-lg mb-1">No VS Code windows detected</p>
          <p class="text-sm">Open a project with “⧉ Edit with VSCode” from All Apps.</p></div>`;

      $("#grid").innerHTML = folders.map(f => {

          <div class="flex items-center gap-2 min-w-0">
            <span>🖥️</span><span class="font-semibold text-white truncate">${f.name}</span>

            <span class="text-xs text-sky-400">Click to focus →</span>
          </div>
        </div>`;

      const r = await api(`/api/vscode/focus-path`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({path})});
      flash(r.message || (r.ok?"Focusing…":"Failed"), r.ok);

        `<option value="${m.path}">${m.name} · ${m.size_gb}GB</option>`).join("");

                  <input id="llm-batch" type="number" placeholder="2048" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded px-2 py-1.5 mono"/>

                    <option value="">Server default</option>
                    <option value="auto">auto</option>
                    <option value="deepseek">deepseek (separate think field)</option>
                    <option value="none">none (inline think tags)</option>
